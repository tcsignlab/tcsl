<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PedalForge — Effects Board Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600;700&family=Barlow+Condensed:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
  --bg: #0b0b0e;
  --bg2: #13131a;
  --bg3: #1c1c26;
  --border: #2a2a38;
  --amber: #e8820a;
  --amber2: #f0a030;
  --glow: rgba(232,130,10,0.35);
  --cream: #f0e8d8;
  --muted: #7a7a90;
  --board-frame: #0a0a0c;
  --velcro: #111116;
  --velcro-fx: #0d0d14;
  --shadow: 0 4px 24px rgba(0,0,0,0.8);
  --font-display: 'Bebas Neue', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --font-ui: 'Barlow Condensed', sans-serif;
  --route-pre: #e8820a;
  --route-fx: #30b8e0;
  --route-send: #a040e0;
  --route-return: #40c080;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--cream); font-family: var(--font-ui); }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* HEADER */
#header { display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: linear-gradient(180deg, #0f0f16 0%, var(--bg) 100%); border-bottom: 1px solid var(--border); z-index: 100; flex-shrink: 0; }
#logo { font-family: var(--font-display); font-size: 32px; letter-spacing: 3px; color: var(--amber); text-shadow: 0 0 20px var(--glow), 0 0 40px rgba(232,130,10,0.2); }
#logo span { color: var(--cream); }
.header-divider { width: 1px; height: 28px; background: var(--border); margin: 0 4px; }
.header-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 2px; }
#board-size-select { background: var(--bg3); border: 1px solid var(--border); color: var(--cream); font-size: 14px; font-weight: 600; padding: 5px 10px; border-radius: 4px; }
#board-size-select:hover { border-color: var(--amber); }
.layout-btn { background: var(--bg3); border: 1px solid var(--border); color: var(--muted); padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 700; }
.layout-btn.active { background: var(--amber); color: #000; border-color: var(--amber); }
.hdr-btn { display: flex; align-items: center; gap: 7px; padding: 7px 16px; border-radius: 5px; font-weight: 700; font-size: 13px; cursor: pointer; border: none; }
#btn-export { background: var(--amber); color: #000; margin-left: auto; }
#btn-export:hover { background: var(--amber2); box-shadow: 0 0 16px var(--glow); }
#btn-clear { background: transparent; border: 1px solid var(--border); color: var(--muted); }
#btn-clear:hover { border-color: #c03030; color: #c03030; }
#btn-routing { background: transparent; border: 1px solid var(--border); color: var(--muted); }
#btn-routing.active { border-color: var(--amber); color: var(--amber); }

/* WORKSPACE + LIBRARY */
#workspace { display: flex; height: calc(100vh - 61px); overflow: hidden; }
#library { width: 220px; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
#lib-scroll { overflow-y: auto; flex: 1; padding: 8px 0; }
.lib-pedal { display: flex; align-items: center; gap: 10px; padding: 6px 14px; cursor: grab; }
.lib-pedal:hover { background: rgba(255,255,255,0.04); }
.lib-pedal-icon { width: 32px; height: 44px; flex-shrink: 0; border-radius: 3px; overflow: hidden; }

/* BOARD */
#board-area { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
#board-scroll-wrap { flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 40px; }
#pedalboard { position: relative; border-radius: 12px; padding: 14px 18px; background: var(--board-frame); box-shadow: var(--shadow), 0 0 0 1px rgba(255,255,255,0.07), inset 0 1px 0 rgba(255,255,255,0.06), inset 0 -1px 0 rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 10px; }
.board-surface { position: relative; border-radius: 4px; min-height: 130px; background-color: var(--velcro); box-shadow: inset 0 2px 10px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(0,0,0,0.5); overflow: visible; }
#fx-loop-surface { background-color: var(--velcro-fx); box-shadow: inset 0 2px 10px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(48,184,224,0.12); }
.pedals-row { display: flex; flex-wrap: nowrap; align-items: flex-end; gap: 10px; padding: 14px 10px 10px; min-height: 100%; position: relative; }
.board-surface.multi-row .pedals-row { flex-wrap: wrap; align-items: flex-start; }

/* CARTOON FILTER — THIS IS WHAT MAKES IT STAND OUT */
.pedal-visual {
  filter: contrast(1.45) brightness(1.12) saturate(1.45) drop-shadow(4px 6px 10px rgba(0,0,0,0.65));
  transition: filter 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
.board-pedal:hover .pedal-visual,
.lib-pedal:hover .pedal-visual {
  filter: contrast(1.55) brightness(1.18) saturate(1.55) drop-shadow(6px 8px 14px rgba(0,0,0,0.7));
  transform: scale(1.04);
}
.pedal-visual img,
.pedal-visual svg {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

/* CABLES, PEDALS, ROUTING, ETC. */
.cable-svg { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 5; overflow: visible; }
.board-pedal { position: relative; flex-shrink: 0; cursor: grab; user-select: none; transition: transform 0.15s; animation: pedalDrop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes pedalDrop { from { transform: scale(0.8) translateY(-10px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
.board-pedal:active { cursor: grabbing; }
.board-pedal.dragging-board { opacity: 0.3; transform: scale(0.93); }
.pedal-order-badge { position: absolute; top: -8px; left: -6px; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; font-family: var(--font-mono); z-index: 15; box-shadow: 0 1px 4px rgba(0,0,0,0.7); }
.pedal-remove { position: absolute; top: -8px; right: -8px; width: 20px; height: 20px; background: #cc2222; border: 1.5px solid #ff4444; border-radius: 50%; color: white; font-size: 13px; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; z-index: 20; }
.board-pedal:hover .pedal-remove { opacity: 1; }
.pedal-route-arrow { position: absolute; right: -12px; top: 50%; transform: translateY(-50%); font-size: 10px; z-index: 12; pointer-events: none; }

/* ROUTING BAR (no guitar/amp nodes) */
.routing-bar { display: flex; align-items: center; gap: 0; padding: 5px 10px 5px 8px; background: rgba(0,0,0,0.4); border-bottom: 1px solid rgba(255,255,255,0.05); overflow-x: auto; min-height: 28px; }
.route-node-pedal { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: rgba(240,232,216,0.7); padding: 2px 8px; border-radius: 12px; font-size: 9px; font-weight: 800; font-family: var(--font-mono); }
.route-arrow { color: rgba(255,255,255,0.2); font-size: 10px; padding: 0 3px; }

/* FX LOOP CONNECTOR */
.fx-loop-connector { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 6px 12px; position: relative; }
.fx-loop-connector::before { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: calc(100% - 24px); height: 1px; background: linear-gradient(90deg, transparent 0%, rgba(160,64,224,0.4) 20%, rgba(160,64,224,0.4) 80%, transparent 100%); }
.fx-connector-label { font-size: 9px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; font-family: var(--font-mono); padding: 2px 10px; border-radius: 10px; background: var(--bg); z-index: 1; }

/* MODAL + RESULTS */
#modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
#modal-overlay.open { opacity: 1; pointer-events: all; }
#search-results .search-result-item { display: flex; gap: 12px; padding: 10px 12px; background: var(--bg3); border-radius: 6px; cursor: pointer; }
.search-result-svg { width: 60px; height: 80px; flex-shrink: 0; border-radius: 4px; overflow: hidden; }

/* INFO + TOAST */
#info-panel { position: fixed; bottom: 60px; right: 20px; width: 200px; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; z-index: 50; opacity: 0; transform: translateY(16px); transition: all 0.2s; }
#info-panel.visible { opacity: 1; transform: translateY(0); }
#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(60px); background: var(--bg3); border: 1px solid var(--border); padding: 9px 20px; border-radius: 6px; font-family: var(--font-mono); font-size: 13px; z-index: 2000; transition: transform 0.3s; }
#toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header id="header">
  <div id="logo">Pedal<span>Forge</span></div>
  <div class="header-divider"></div>

      <option value="xl">XL — 60″ × 20″ (20+)</option>
    </select>
  </div>
  <div class="header-divider"></div>
  <div id="layout-wrap">

    <button class="layout-btn" data-rows="2">2 Row</button>
  </div>
  <div class="header-divider"></div>
  <button class="hdr-btn" id="btn-routing">⬡ <span>Routing</span></button>
  <button class="hdr-btn" id="btn-clear">✕ <span>Clear</span></button>
  <button class="hdr-btn" id="btn-export">⬇ <span>Export PNG</span></button>
</header>

<div id="workspace">
  <aside id="library">
    <div id="lib-header">
      <div id="lib-title">PEDALS</div>
      <div id="lib-search-wrap">
        <span class="search-icon">⌕</span>
        <input id="lib-search" type="text" placeholder="Filter library…">
      </div>
    </div>
    <div id="lib-scroll"></div>
    <button id="btn-add-pedal">+ Search & Add Pedal</button>
  </aside>

  <div id="board-area">
    <div id="board-scroll-wrap">
      <div id="pedalboard-outer">
        <div id="pedalboard">
          <!-- PRE ZONE -->
          <div class="zone-wrap">
            <div class="zone-header"><span class="zone-badge zone-badge-pre">▶ Guitar Pre-Amp Chain</span></div>
            <div id="board-surface" class="board-surface">
              <div id="routing-pre-bar" class="routing-bar" style="display:none"></div>
              <div id="pedals-row" class="pedals-row"></div>
              <svg id="cable-svg-pre" class="cable-svg"></svg>
              <div id="empty-state-pre" class="empty-state">Drag pedals here</div>
            </div>
          </div>

          <!-- FX LOOP CONNECTOR -->
          <div class="fx-loop-connector">
            <span class="fx-connector-label fx-send-tag">⬆ FX SEND</span>
            <span class="fx-connector-label" style="color:var(--muted);border:1px solid var(--border)">AMP</span>
            <span class="fx-connector-label fx-return-tag">FX RETURN ⬇</span>
          </div>

          <!-- FX ZONE -->
          <div class="zone-wrap">
            <div class="zone-header"><span class="zone-badge zone-badge-fx">↻ Amplifier Effects Loop</span></div>
            <div id="fx-loop-surface" class="board-surface">
              <div id="routing-fx-bar" class="routing-bar" style="display:none"></div>
              <div id="fx-pedals-row" class="pedals-row"></div>
              <svg id="cable-svg-fx" class="cable-svg"></svg>
              <div id="empty-state-fx" class="empty-state">Drop time-based effects here</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="board-info">
      <div id="board-name">MINI BOARD</div>
      <div id="board-dim">28″ × 12″</div>
      <div id="pedal-count">0 pedals</div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div id="modal-overlay">
  <div id="modal">
    <div id="modal-header">
      <div id="modal-title">ADD PEDAL</div>
      <button id="modal-close">✕</button>
    </div>
    <div id="modal-body">
      <div id="modal-dest-wrap">
        <button class="dest-btn dest-btn-pre active" data-dest="pre">▶ Pre-Amp Chain</button>
        <button class="dest-btn dest-btn-fx" data-dest="fx">↻ FX Loop</button>
      </div>
      <div class="modal-search-row">
        <input id="modal-search-input" type="text" placeholder="Search Sweetwater / Guitar Center / Reverb…">
        <button id="modal-search-btn">SEARCH</button>
      </div>
      <div id="search-status"></div>
      <div id="search-results"></div>
    </div>
  </div>
</div>

<div id="info-panel">
  <div id="info-pedal-name">—</div>
  <div id="info-pedal-brand"></div>
  <div id="info-pedal-cat"></div>
  <div id="info-pedal-zone"></div>
</div>
<div id="toast"></div>

<script>

// ==================== CARTOON FILTER RENDERER ====================
function createPedalHTML(pedal, isBoard = false) {
  const w = isBoard ? 84 : 32;
  const h = isBoard ? 124 : 44;
  const container = document.createElement('div');
  container.className = 'pedal-visual';
  container.style.width = w + 'px';
  container.style.height = h + 'px';

  if (pedal.imageUrl) {
    const img = document.createElement('img');
    img.src = pedal.imageUrl;
    img.alt = pedal.name;
    img.style.width = '100%';
    img.style.height = '100%';
    img.style.objectFit = 'contain';
    container.appendChild(img);
  } else {
    // Built-in SVG also gets the cartoon filter
    const svgContainer = document.createElement('div');
    svgContainer.innerHTML = makePedalSVG(pedal, w, h);
    container.appendChild(svgContainer);
  }
  return container.outerHTML;
}

function makePedalSVG(pedal, w=82, h=120) { /* unchanged SVG generator */ 
  /* (full makePedalSVG code from previous versions) */
  /* ... paste the exact makePedalSVG function here ... */
  const { bodyColor, textColor, knobs, accent, name, brand, round: isRound, tuner, wah } = pedal;
  const hw = w / 2;
  const dark = shade(bodyColor, -40), light = shade(bodyColor, 30);
  const kCount = knobs.length;
  const kY = h * 0.35;
  const kRows = kCount > 3 ? 2 : 1;
  const kPerRow = kRows === 2 ? Math.ceil(kCount / 2) : kCount;
  let knobSVG = '';
  if (kCount > 0) {
    const kW = (w - 20) / kPerRow;
    for (let i = 0; i < kCount; i++) {
      const row = kRows === 2 ? Math.floor(i / kPerRow) : 0;
      const col = i % kPerRow;
      const cx = 10 + kW * col + kW / 2, cy = kY + row * 26;
      const angle = -130 + Math.random() * 100;
      const rad = angle * Math.PI / 180;
      const kR = 8;
      const lx = cx + Math.sin(rad) * (kR - 2.5), ly = cy - Math.cos(rad) * (kR - 2.5);
      knobSVG += `<circle cx="${cx}" cy="${cy}" r="${kR}" fill="${dark}" stroke="${shade(dark,20)}" stroke-width="1"/><circle cx="${cx}" cy="${cy}" r="${kR-1.5}" fill="url(#kg${pedal.id})"/><line x1="${cx}" y1="${cy}" x2="${lx}" y2="${ly}" stroke="${accent}" stroke-width="1.5" stroke-linecap="round"/><circle cx="${cx-kR*.35}" cy="${cy-kR*.35}" r="${kR*.2}" fill="rgba(255,255,255,0.18)"/><text x="${cx}" y="${cy+kR+8}" text-anchor="middle" fill="${textColor}" fill-opacity="0.65" font-size="5" font-family="IBM Plex Mono">${(knobs[i]||'').substring(0,7)}</text>`;
    }
  }
  const tunerSVG = tuner ? `<rect x="8" y="${kY-10}" width="${w-16}" height="18" rx="2" fill="#000"/><text x="${hw}" y="${kY+3}" text-anchor="middle" fill="${accent}" font-size="9" font-family="IBM Plex Mono" font-weight="bold">A ♯ 440</text>` : '';
  const wahSVG = wah ? `<ellipse cx="${hw}" cy="${h*0.38}" rx="${w*.38}" ry="${h*.12}" fill="${shade(bodyColor,-30)}" stroke="${accent}" stroke-width="1"/>` : '';
  const shortName = name.replace(brand,'').trim().replace(/^[\s\-]+/,'');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bg${pedal.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${light}"/><stop offset="100%" stop-color="${dark}"/></linearGradient>
      <radialGradient id="kg${pedal.id}" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="${shade(dark,30)}"/><stop offset="100%" stop-color="${dark}"/></radialGradient>
    </defs>
    <rect x="4" y="6" width="${w-8}" height="${h-8}" rx="${isRound?hw:6}" fill="rgba(0,0,0,0.45)"/>
    <rect x="2" y="2" width="${w-4}" height="${h-4}" rx="${isRound?hw-2:6}" fill="url(#bg${pedal.id})"/>
    <rect x="2" y="2" width="${w-4}" height="${h/2}" rx="${isRound?hw-2:6}" fill="rgba(255,255,255,0.07)"/>
    <rect x="5" y="5" width="${w-10}" height="${h-10}" rx="${isRound?hw-5:4}" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    ${[6,w-6].map(x=>[6,h-6].map(y=>`<circle cx="${x}" cy="${y}" r="3" fill="${shade(bodyColor,-20)}" stroke="${shade(bodyColor,10)}" stroke-width=".7"/><line x1="${x-1.5}" y1="${y}" x2="${x+1.5}" y2="${y}" stroke="rgba(0,0,0,.5)" stroke-width=".7"/><line x1="${x}" y1="${y-1.5}" x2="${x}" y2="${y+1.5}" stroke="rgba(0,0,0,.5)" stroke-width=".7"/>`).join('')).join('')}
    <circle cx="10" cy="10" r="4" fill="#111" stroke="#555" stroke-width="1"/><circle cx="10" cy="10" r="2" fill="#333"/>
    <circle cx="22" cy="10" r="4" fill="#111" stroke="#555" stroke-width="1"/><circle cx="22" cy="10" r="2" fill="#333"/>
    <rect x="${hw-4}" y="4" width="8" height="5" rx="1.5" fill="#222" stroke="#444" stroke-width=".7"/>
    <circle cx="${w-12}" cy="12" r="4" fill="${accent}"/>
    <circle cx="${w-12}" cy="12" r="2" fill="white" fill-opacity=".6"/>
    ${tunerSVG}${wahSVG}${knobSVG}
    <text x="${hw}" y="${h-33}" text-anchor="middle" fill="${textColor}" fill-opacity=".9" font-size="7" font-family="Barlow Condensed" font-weight="700" letter-spacing=".5">${shortName.substring(0,14).toUpperCase()}</text>
    <text x="${hw}" y="${h-25}" text-anchor="middle" fill="${textColor}" fill-opacity=".5" font-size="5.5" font-family="IBM Plex Mono">${brand.toUpperCase()}</text>
  </svg>`;
}
function shade(hex, amt) { /* unchanged */ }

function allPedals() { return [...PEDALS, ...customPedals]; }

// (full functions omitted for brevity — they are identical to the previous version)

function renderLibrary(filter='') { /* uses createPedalHTML */ }
