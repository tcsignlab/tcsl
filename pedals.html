<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PedalForge — Effects Board Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600;700&family=Barlow+Condensed:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
  --bg:#08080a;--bg2:#111114;--bg3:#18181e;--border:#252530;
  --amber:#e8820a;--amber2:#f0a030;--glow:rgba(232,130,10,.35);
  --cream:#f0e8d8;--muted:#686880;
  --board-black:#07070a;--velcro:#0d0d11;--velcro-fx:#0a0a0f;
  --route-pre:#e8820a;--route-fx:#28b8e0;--route-send:#a040e0;--route-return:#30c070;
  --font-d:'Bebas Neue',sans-serif;--font-m:'IBM Plex Mono',monospace;--font-u:'Barlow Condensed',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--cream);font-family:var(--font-u)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
#svg-filters{position:absolute;width:0;height:0;overflow:hidden}

/* HEADER */
#header{display:flex;align-items:center;gap:14px;padding:8px 18px;background:linear-gradient(180deg,#0d0d12,var(--bg));border-bottom:1px solid var(--border);position:relative;z-index:100;flex-shrink:0}
#logo{font-family:var(--font-d);font-size:30px;letter-spacing:3px;color:var(--amber);text-shadow:0 0 18px var(--glow),0 0 36px rgba(232,130,10,.15);line-height:1}
#logo span{color:var(--cream)}
.hdiv{width:1px;height:26px;background:var(--border);margin:0 2px}
.hlabel{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:2px}
#board-size-select{background:var(--bg3);border:1px solid var(--border);color:var(--cream);font-family:var(--font-u);font-size:13px;font-weight:600;padding:5px 9px;border-radius:4px;cursor:pointer;outline:none}
#board-size-select:hover{border-color:var(--amber)}
#layout-wrap{display:flex;gap:5px}
.layout-btn{background:var(--bg3);border:1px solid var(--border);color:var(--muted);padding:5px 9px;border-radius:4px;cursor:pointer;font-size:12px;font-weight:700;font-family:var(--font-u);transition:all .14s}
.layout-btn:hover{border-color:var(--amber);color:var(--amber)}
.layout-btn.active{background:var(--amber);border-color:var(--amber);color:#000}
.hbtn{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:5px;font-family:var(--font-u);font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border:none;transition:all .17s}
#btn-export{background:var(--amber);color:#000;margin-left:auto}
#btn-export:hover{background:var(--amber2);box-shadow:0 0 14px var(--glow)}
#btn-clear{background:transparent;border:1px solid var(--border);color:var(--muted)}
#btn-clear:hover{border-color:#c03030;color:#c03030}
#btn-routing{background:transparent;border:1px solid var(--border);color:var(--muted)}
#btn-routing.active{border-color:var(--amber);color:var(--amber)}

/* WORKSPACE */
#workspace{display:flex;height:calc(100vh - 57px);overflow:hidden}

/* LIBRARY */
#library{width:215px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
#lib-header{padding:10px 13px 7px;border-bottom:1px solid var(--border);flex-shrink:0}
#lib-title{font-family:var(--font-d);font-size:17px;letter-spacing:2px;color:var(--amber)}
#lib-search-wrap{position:relative;margin-top:7px}
#lib-search{width:100%;padding:6px 9px 6px 28px;background:var(--bg3);border:1px solid var(--border);color:var(--cream);font-family:var(--font-m);font-size:11px;border-radius:4px;outline:none}
#lib-search:focus{border-color:var(--amber)}
.si{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px;pointer-events:none}
#lib-scroll{overflow-y:auto;flex:1;padding:6px 0}
.cat-header{display:flex;align-items:center;justify-content:space-between;padding:5px 13px 3px;cursor:pointer;user-select:none}
.cat-name{font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
.cat-arrow{color:var(--muted);font-size:10px;transition:transform .18s}
.cat-header.open .cat-arrow{transform:rotate(90deg)}
.cat-body.collapsed{display:none}
.lib-pedal{display:flex;align-items:center;gap:9px;padding:5px 13px;cursor:grab;user-select:none;transition:background .1s;border-left:2px solid transparent}
.lib-pedal:hover{background:rgba(255,255,255,.04)}
.lib-pedal:active{cursor:grabbing}
.lib-pedal.dragging{opacity:.4}
.lib-icon{width:30px;height:42px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:3px;overflow:hidden}
.lib-name{font-size:11px;font-weight:700;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-brand{font-size:9px;color:var(--muted);font-family:var(--font-m)}
#btn-add-pedal{margin:9px 13px;padding:8px;background:transparent;border:1px dashed var(--border);color:var(--muted);border-radius:5px;cursor:pointer;font-family:var(--font-u);font-size:12px;font-weight:700;text-align:center;transition:all .14s;flex-shrink:0}
#btn-add-pedal:hover{border-color:var(--amber);color:var(--amber)}

/* BOARD AREA */
#board-area{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);position:relative}
#board-area::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.03) 1px,transparent 1px);background-size:26px 26px;pointer-events:none;z-index:0}
#board-scroll-wrap{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:36px;position:relative;z-index:1}

/* PEDALBOARD (BLACK) */
#pedalboard{position:relative;border-radius:12px;padding:12px 16px;background:var(--board-black);box-shadow:0 6px 36px rgba(0,0,0,.95),0 0 0 1px rgba(255,255,255,.07),inset 0 1px 0 rgba(255,255,255,.06);display:flex;flex-direction:column;gap:8px;flex-shrink:0}
#pedalboard::before,#pedalboard::after{content:'';position:absolute;left:14px;right:14px;height:6px;background:linear-gradient(180deg,rgba(255,255,255,.3) 0%,rgba(155,155,165,.48) 35%,rgba(55,55,65,.78) 70%,rgba(18,18,22,.9) 100%);border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.8),0 0 0 .5px rgba(255,255,255,.07)}
#pedalboard::before{top:3px}
#pedalboard::after{bottom:3px}

/* ZONES */
.zone-header{display:flex;align-items:center;gap:8px;padding:0 2px 4px}
.zone-badge{font-size:8px;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:2px 7px;border-radius:3px}
.zbadge-pre{background:rgba(232,130,10,.12);color:var(--route-pre);border:1px solid rgba(232,130,10,.28)}
.zbadge-fx{background:rgba(40,184,224,.1);color:var(--route-fx);border:1px solid rgba(40,184,224,.28)}

/* ROUTING BAR */
.routing-bar{display:flex;align-items:center;gap:0;padding:4px 8px;background:rgba(0,0,0,.45);border-bottom:1px solid rgba(255,255,255,.04);overflow-x:auto;overflow-y:hidden;flex-shrink:0;min-height:26px;scrollbar-width:none}
.routing-bar::-webkit-scrollbar{display:none}
.rnode{display:flex;align-items:center;gap:4px;padding:1px 7px;border-radius:10px;flex-shrink:0;font-size:8px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;font-family:var(--font-m);white-space:nowrap}
.rnode-pedal{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);color:rgba(240,232,216,.65)}
.rnum{background:rgba(255,255,255,.14);border-radius:50%;width:13px;height:13px;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;flex-shrink:0}
.rarr{flex-shrink:0;font-size:9px;padding:0 2px}
.rarr-pre{color:rgba(232,130,10,.45)}
.rarr-fx{color:rgba(40,184,224,.45)}

/* FX LOOP CONNECTOR STRIP */
.fx-strip{display:flex;align-items:center;justify-content:center;gap:10px;padding:5px 10px;position:relative}
.fx-strip::before{content:'';position:absolute;top:50%;left:14px;right:14px;height:1px;background:linear-gradient(90deg,transparent,rgba(160,64,224,.4),rgba(160,64,224,.4),transparent)}
.fxt{font-size:8px;font-weight:800;letter-spacing:2px;text-transform:uppercase;font-family:var(--font-m);padding:2px 9px;border-radius:9px;background:var(--bg);position:relative;z-index:1}
.fxt-send{color:var(--route-send);border:1px solid rgba(160,64,224,.4)}
.fxt-amp{color:var(--muted);border:1px solid var(--border)}
.fxt-return{color:var(--route-return);border:1px solid rgba(48,192,112,.4)}

/* VELCRO SURFACE */
.board-surface{position:relative;border-radius:5px;min-height:120px;background-color:var(--velcro);background-image:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.22) 2px,rgba(0,0,0,.22) 3px),repeating-linear-gradient(90deg,transparent,transparent 2px,rgba(0,0,0,.14) 2px,rgba(0,0,0,.14) 3px);box-shadow:inset 0 2px 10px rgba(0,0,0,.7),inset 0 0 0 1px rgba(0,0,0,.5);overflow:visible}
.board-surface.drag-over{box-shadow:inset 0 0 0 2px var(--amber),inset 0 2px 8px rgba(0,0,0,.6)}
#fx-loop-surface{background-color:var(--velcro-fx);background-image:repeating-linear-gradient(45deg,transparent,transparent 3px,rgba(40,184,224,.018) 3px,rgba(40,184,224,.018) 4px),repeating-linear-gradient(-45deg,transparent,transparent 3px,rgba(0,0,0,.1) 3px,rgba(0,0,0,.1) 4px)}
#fx-loop-surface.drag-over{box-shadow:inset 0 0 0 2px var(--route-fx),inset 0 2px 8px rgba(0,0,0,.6)}

/* PEDAL ROWS */
.pedals-row{display:flex;flex-wrap:nowrap;align-items:center;gap:0;padding:12px 10px 10px;min-height:100%;position:relative}
.board-surface.multi-row .pedals-row{flex-wrap:wrap;align-items:flex-start}

/* BOARD PEDAL */
.board-pedal{position:relative;flex-shrink:0;cursor:grab;user-select:none;transition:transform .15s,filter .15s;animation:pdrop .22s cubic-bezier(.34,1.56,.64,1)}
@keyframes pdrop{from{transform:scale(.8) translateY(-8px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.board-pedal:hover{z-index:10;transform:translateY(-5px) scale(1.04)}
.board-pedal:active{cursor:grabbing}
.board-pedal.dragging-board{opacity:.25;transform:scale(.92)}

/* PEDAL CARD */
.pedal-card{width:84px;height:124px;border-radius:7px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(255,255,255,.03);box-shadow:0 2px 12px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06)}

/* Real image with cartoon filter */
.pedal-real-img{width:100%;height:100%;object-fit:contain;display:block;filter:url(#cartoon) saturate(2.2) contrast(1.4) drop-shadow(0 3px 9px rgba(0,0,0,.9))}

/* Shimmer loading state */
.pedal-loading{width:84px;height:124px;border-radius:7px;flex-shrink:0;background:linear-gradient(110deg,#0f0f14 30%,#1a1a22 50%,#0f0f14 70%);background-size:200% 100%;animation:shimmer 1.4s infinite;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,.7)}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.pedal-loading-icon{opacity:.22}

/* SVG fallback */
.pedal-svg-fallback{flex-shrink:0;filter:drop-shadow(0 3px 7px rgba(0,0,0,.85))}

/* ORDER BADGE */
.pedal-badge{position:absolute;top:-7px;left:-5px;width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;font-family:var(--font-m);z-index:15;box-shadow:0 1px 4px rgba(0,0,0,.7)}
.badge-pre{background:var(--route-pre);color:#000}
.badge-fx{background:var(--route-fx);color:#000}

/* REMOVE BUTTON */
.pedal-remove{position:absolute;top:-7px;right:-7px;width:19px;height:19px;background:#c02020;border:1.5px solid #ff4444;border-radius:50%;color:white;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .14s;z-index:20;font-weight:bold}
.board-pedal:hover .pedal-remove{opacity:1}

/* JUMPER CONNECTOR */
.jumper-wrap{flex-shrink:0;display:flex;align-items:center;justify-content:center;width:28px;height:124px;z-index:2}

/* EMPTY STATE */
.empty-state{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;pointer-events:none;z-index:2}
.empty-state svg{opacity:.1}
.empty-state p{color:var(--muted);font-family:var(--font-m);font-size:10px;opacity:.5;text-align:center;padding:0 16px}
.empty-state.hidden{display:none}

/* BOARD INFO */
#board-info{padding:7px 18px;display:flex;align-items:center;gap:18px;border-top:1px solid var(--border);background:var(--bg2);flex-shrink:0;z-index:10}
#board-name{font-family:var(--font-d);font-size:19px;letter-spacing:2px;color:var(--amber)}
#board-dim{font-size:11px;color:var(--muted);font-family:var(--font-m)}
#pedal-count{font-size:11px;color:var(--muted);font-family:var(--font-m);margin-left:auto}

/* MODAL */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:1000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .2s}
#modal-overlay.open{opacity:1;pointer-events:all}
#modal{background:var(--bg2);border:1px solid var(--border);border-radius:10px;width:520px;max-width:95vw;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.85)}
#modal-header{padding:14px 18px 11px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
#modal-title{font-family:var(--font-d);font-size:22px;letter-spacing:2px;color:var(--amber)}
#modal-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;transition:color .14s}
#modal-close:hover{color:var(--cream)}
#modal-body{padding:14px 18px;overflow-y:auto;flex:1}
#modal-dest-wrap{display:flex;gap:8px;margin-bottom:12px}
.dest-btn{flex:1;padding:7px;border-radius:5px;cursor:pointer;font-family:var(--font-u);font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;text-align:center;transition:all .14s;border:1.5px solid}
.dest-pre{border-color:rgba(232,130,10,.35);color:var(--route-pre);background:rgba(232,130,10,.07)}
.dest-pre.active{background:var(--route-pre);color:#000;border-color:var(--route-pre)}
.dest-fx{border-color:rgba(40,184,224,.35);color:var(--route-fx);background:rgba(40,184,224,.07)}
.dest-fx.active{background:var(--route-fx);color:#000;border-color:var(--route-fx)}
.modal-row{display:flex;gap:9px;margin-bottom:12px}
#modal-search-input{flex:1;padding:8px 12px;background:var(--bg3);border:1px solid var(--border);color:var(--cream);font-family:var(--font-m);font-size:12px;border-radius:5px;outline:none}
#modal-search-input:focus{border-color:var(--amber)}
#modal-search-btn{padding:8px 16px;background:var(--amber);color:#000;border:none;border-radius:5px;font-family:var(--font-u);font-weight:800;font-size:12px;cursor:pointer;transition:background .14s}
#modal-search-btn:hover{background:var(--amber2)}
#search-results{display:flex;flex-direction:column;gap:7px}
.sri{display:flex;align-items:center;gap:11px;padding:9px 11px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;cursor:pointer;transition:all .14s}
.sri:hover{border-color:var(--amber);background:rgba(232,130,10,.06)}
.sri-svg{width:42px;height:58px;flex-shrink:0}
.sri-name{font-weight:700;font-size:13px;color:var(--cream)}
.sri-brand{font-size:10px;color:var(--muted);font-family:var(--font-m);margin-top:2px}
.sri-cat{font-size:9px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-top:3px}
.sri-add{padding:5px 11px;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:4px;font-family:var(--font-u);font-weight:700;font-size:11px;cursor:pointer;transition:all .14s;white-space:nowrap}
.sri-add:hover{border-color:var(--amber);color:var(--amber)}
#search-status{text-align:center;padding:14px;color:var(--muted);font-family:var(--font-m);font-size:12px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--amber);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:7px}
@keyframes spin{to{transform:rotate(360deg)}}

/* INFO PANEL */
#info-panel{position:fixed;bottom:56px;right:18px;width:190px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:11px;z-index:50;transform:translateY(14px);opacity:0;transition:all .18s;pointer-events:none}
#info-panel.visible{transform:translateY(0);opacity:1;pointer-events:all}
#info-name{font-family:var(--font-d);font-size:18px;letter-spacing:1px;color:var(--amber)}
#info-brand{font-size:10px;color:var(--muted);font-family:var(--font-m);margin-bottom:5px}
#info-cat{font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
#info-zone{font-size:9px;color:var(--muted);font-family:var(--font-m);margin-top:3px}

/* TOAST */
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(55px);background:var(--bg3);border:1px solid var(--border);padding:8px 18px;border-radius:6px;font-family:var(--font-m);font-size:12px;z-index:2000;transition:transform .28s;white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.success{border-color:#30c060;color:#30c060}
#toast.error{border-color:#c03030;color:#c03030}
</style>
</head>
<body>

<!-- SVG cartoon filter definition -->
<svg id="svg-filters">
  <defs>
    <filter id="cartoon" color-interpolation-filters="sRGB" x="-5%" y="-5%" width="110%" height="110%">
      <feColorMatrix type="saturate" values="2.8" result="sat"/>
      <feConvolveMatrix order="3" kernelMatrix="0 -0.8 0 -0.8 4.2 -0.8 0 -0.8 0" in="sat" result="sharp"/>
      <feComponentTransfer in="sharp" result="poster">
        <feFuncR type="discrete" tableValues="0 0.15 0.35 0.55 0.75 0.9 1"/>
        <feFuncG type="discrete" tableValues="0 0.15 0.35 0.55 0.75 0.9 1"/>
        <feFuncB type="discrete" tableValues="0 0.15 0.35 0.55 0.75 0.9 1"/>
      </feComponentTransfer>
    </filter>
  </defs>
</svg>

<header id="header">
  <div id="logo">Pedal<span>Forge</span></div>
  <div class="hdiv"></div>
  <div>
    <div class="hlabel">Board Size</div>
    <select id="board-size-select">
      <option value="nano">Nano — 16″ × 6″ (2–4)</option>
      <option value="pedalette">Pedalette — 22″ × 9″ (4–6)</option>
      <option value="mini" selected>Mini — 28″ × 12″ (6–8)</option>
      <option value="standard">Standard — 36″ × 16″ (9–12)</option>
      <option value="large">Large — 48″ × 16″ (13–18)</option>
      <option value="xl">XL — 60″ × 20″ (20+)</option>
    </select>
  </div>
  <div class="hdiv"></div>
  <div>
    <div class="hlabel">Layout</div>
    <div id="layout-wrap">
      <button class="layout-btn active" data-rows="1">1 Row</button>
      <button class="layout-btn" data-rows="2">2 Row</button>
    </div>
  </div>
  <div class="hdiv"></div>
  <button class="hbtn" id="btn-routing">⬡ <span>Routing</span></button>
  <button class="hbtn" id="btn-clear">✕ <span>Clear</span></button>
  <button class="hbtn" id="btn-export">⬇ <span>Export PNG</span></button>
</header>

<div id="workspace">
  <aside id="library">
    <div id="lib-header">
      <div id="lib-title">PEDALS</div>
      <div id="lib-search-wrap">
        <span class="si">⌕</span>
        <input id="lib-search" type="text" placeholder="Filter library…">
      </div>
    </div>
    <div id="lib-scroll"></div>
    <button id="btn-add-pedal">+ Search &amp; Add Pedal</button>
  </aside>

  <div id="board-area">
    <div id="board-scroll-wrap">
      <div id="pedalboard">

        <!-- PRE-AMP ZONE -->
        <div>
          <div class="zone-header">
            <span class="zone-badge zbadge-pre">▶ Guitar Pre-Amp Chain</span>
          </div>
          <div id="board-surface" class="board-surface">
            <div id="routing-pre-bar" class="routing-bar" style="display:none"></div>
            <div id="pedals-row" class="pedals-row"></div>
            <div id="empty-pre" class="empty-state">
              <svg width="56" height="56" viewBox="0 0 80 80" fill="none"><rect x="10" y="20" width="60" height="40" rx="5" stroke="white" stroke-width="2"/><circle cx="28" cy="36" r="7" stroke="white" stroke-width="2"/><circle cx="52" cy="36" r="7" stroke="white" stroke-width="2"/></svg>
              <p>Drag pedals here — drives, wahs, compressors</p>
            </div>

middle" fill="${ac}" font-size="8" font-family="IBM Plex Mono" font-weight="bold">A ♯ 440</text>`:''} ${wah?`<ellipse cx="${hw}" cy="${h*.37}" rx="${w*.37}" ry="${h*.11}" fill="${shade(bc,-28)}" stroke="${ac}" stroke-width="1"/>`:''} ${ks}<text x="${hw}" y="${h-32}" text-anchor="middle" fill="${tc}" fill-opacity=".9" font-size="6.5" font-family="Barlow Condensed" font-weight="700" letter-spacing=".5">${sn}</text><text x="${hw}" y="${h-24}" text-anchor="middle" fill="${tc}" fill-opacity=".5" font-size="5" font-family="IBM Plex Mono">${brand.toUpperCase().substring(0,14)}</text><circle cx="${hw}" cy="${h-17}" r="11" fill="#1a1a1a" stroke="#555" stroke-width="1.4"/><circle cx="${hw}" cy="${h-17}" r="8" fill="#252525"/><circle cx="${hw-2.5}" cy="${h-19.5}" r="2.5" fill="rgba(255,255,255,.07)"/></svg>`;

// ── IMAGE PIPELINE ───────────────────────────────────────
// Primary strategy: Anthropic API with web_search (real web access)
// Fallback: direct CORS proxy load of any URL found
// Background removal: flood-fill from border + feathered edges

const IMG_VER = 'v5'; // bump this to bust all cached images
const CORS_PROXIES = [
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
  url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
];

// In-flight tracker: prevent duplicate fetches for the same pedal
const inFlight = new Set();

function imgKey(id) { return `pfimg_${IMG_VER}_${id}`; }

function cacheSet(id, val) {
  imgCache[id] = val;
  try {
    localStorage.setItem(imgKey(id), val);
  } catch(e) {
    // Quota exceeded — evict old versions then retry
    try {
      const dead = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith('pfimg_') && !k.startsWith('pfimg_' + IMG_VER)) dead.push(k);
      }
      dead.forEach(k => localStorage.removeItem(k));
      localStorage.setItem(imgKey(id), val);
    } catch(e2) {}
  }
}

async function loadPedalImage(pedal) {
  // 1. Memory cache
  if (imgCache[pedal.id]) return imgCache[pedal.id] === 'FAILED' ? null : imgCache[pedal.id];
  // 2. localStorage cache (correct versioned key)
  try {
    const v = localStorage.getItem(imgKey(pedal.id));
    if (v) { imgCache[pedal.id] = v; return v === 'FAILED' ? null : v; }
  } catch(e) {}
  // 3. Deduplicate in-flight requests
  if (inFlight.has(pedal.id)) {
    return new Promise(resolve => {
      const poll = setInterval(() => {
        if (!inFlight.has(pedal.id)) {
          clearInterval(poll);
          resolve(imgCache[pedal.id] === 'FAILED' ? null : imgCache[pedal.id] || null);
        }
      }, 200);
    });
  }
  inFlight.add(pedal.id);
  try {
    const url = await findImageUrl(pedal);
    if (url) {
      const processed = await processImage(url);
      if (processed) { cacheSet(pedal.id, processed); return processed; }
    }
    cacheSet(pedal.id, 'FAILED');
    return null;
  } catch(e) {
    cacheSet(pedal.id, 'FAILED');
    return null;
  } finally {
    inFlight.delete(pedal.id);
  }
}

// ── IMAGE FINDER: Anthropic web_search as primary ────────
// Retailer sites are JS-rendered so HTML scraping returns empty pages.
// The Anthropic API has real web access and reliably finds image URLs.
async function findImageUrl(pedal) {
  const query = `${pedal.brand} ${pedal.name}`;

  // ── PRIMARY: Anthropic API + web_search ─────────────────
  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 500,
        tools: [{ type: 'web_search_20250305', name: 'web_search' }],
        messages: [{
          role: 'user',
          content: `Search for a product image of the "${query}" guitar effects pedal. I need a direct image URL (ending in .jpg, .jpeg, .png, or .webp) from sweetwater.com, guitarcenter.com, musiciansfriend.com, the manufacturer's site, or any gear retailer. Prefer a top-down or front-facing product photo on a plain background. Return ONLY the direct image URL — nothing else, no markdown, no explanation.`
        }]
      })
    });
    if (resp.ok) {
      const data = await resp.json();
      // Extract text from response — handle both text blocks and tool_result blocks
      const allText = (data.content || [])
        .filter(b => b.type === 'text')
        .map(b => b.text)
        .join('\n');
      // Also check tool results for embedded image URLs
      const toolResults = (data.content || [])
        .filter(b => b.type === 'tool_result')
        .flatMap(b => (b.content || []).filter(c => c.type === 'text').map(c => c.text))
        .join('\n');
      const combined = allText + '\n' + toolResults;
      // Extract first valid image URL
      const m = combined.match(/https?:\/\/[^\s"'<>\n\]]+\.(jpg|jpeg|png|webp)(\?[^\s"'<>\n\]]*)?/i);
      if (m && m[0]) return m[0];
    }
  } catch(e) {}

  // ── FALLBACK: try loading image directly via CORS proxies ─
  // This works if the pedal has a known/guessable CDN URL pattern
  const guessedUrls = guessImageUrls(pedal);
  for (const u of guessedUrls) {
    const result = await tryLoadImage(CORS_PROXIES[0](u), 5000);
    if (result) return u; // return original URL so processImage can proxy it
  }

  return null;
}

// ── GUESS CDN URLS for known brands ──────────────────────
function guessImageUrls(pedal) {
  const slug = (pedal.name + ' ' + pedal.brand)
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-|-$/g, '');
  const slug2 = pedal.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  return [
    // Sweetwater CDN pattern
    `https://media.sweetwater.com/api/i/q-82__w-600__ha-bc5b24ce4da33e3e__hmac-/images/items/750/${slug2}.jpg`,
    `https://media.sweetwater.com/api/i/q-82__w-600__ha-bc5b24ce4da33e3e__hmac-/images/items/750/${slug}.jpg`,
  ];
}

// ── PROCESS IMAGE: CORS proxy load + background removal ──
async function processImage(imgUrl) {
  for (const makeProxy of CORS_PROXIES) {
    const result = await tryLoadImage(makeProxy(imgUrl), 12000);
    if (result) return result;
  }
  return null;
}

// Try to load an image src onto a canvas and return data URL, or null
function tryLoadImage(src, timeout = 12000) {
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    let done = false;
    const finish = (val) => { if (!done) { done = true; resolve(val); } };
    img.onload = () => {
      try {
        const W = img.naturalWidth || img.width;
        const H = img.naturalHeight || img.height;
        if (W < 40 || H < 40) { finish(null); return; }
        const canvas = document.createElement('canvas');
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        removeBackground(ctx, W, H);
        finish(canvas.toDataURL('image/png'));
      } catch(e) { finish(null); }
    };
    img.onerror = () => finish(null);
    img.src = src;
    setTimeout(() => finish(null), timeout);
  });
}

// ── ADVANCED BACKGROUND REMOVAL ──────────────────────────
// Samples border pixels to detect bg colour, flood-fills from edges,
// then feathers the resulting mask for clean cutout edges.
function removeBackground(ctx, w, h) {
  const id = ctx.getImageData(0, 0, w, h);
  const d = id.data;

  // Sample border pixels to find average bg colour
  let rS=0, gS=0, bS=0, n=0;
  const step = Math.max(1, Math.floor(Math.min(w,h)/24));
  for (let x=0; x<w; x+=step) { let p=(0*w+x)*4; rS+=d[p];gS+=d[p+1];bS+=d[p+2];n++; p=((h-1)*w+x)*4; rS+=d[p];gS+=d[p+1];bS+=d[p+2];n++; }
  for (let y=0; y<h; y+=step) { let p=(y*w+0)*4; rS+=d[p];gS+=d[p+1];bS+=d[p+2];n++; p=(y*w+(w-1))*4; rS+=d[p];gS+=d[p+1];bS+=d[p+2];n++; }
  const bgR=rS/n, bgG=gS/n, bgB=bS/n;
  const bgLuma = bgR*0.299 + bgG*0.587 + bgB*0.114;

  const cdist = (px) => { const dr=d[px]-bgR,dg=d[px+1]-bgG,db=d[px+2]-bgB; return Math.sqrt(dr*dr+dg*dg+db*db); };
  const tol = bgLuma > 200 ? 32 : bgLuma > 100 ? 24 : 20;

  // Flood fill from all border pixels
  const visited = new Uint8Array(w*h);
  const mask    = new Uint8Array(w*h);
  const stack   = [];
  for (let x=0; x<w; x++) { stack.push(x, (h-1)*w+x); }
  for (let y=0; y<h; y++) { stack.push(y*w, y*w+(w-1)); }

  while (stack.length) {
    const idx = stack.pop();
    if (idx < 0 || idx >= w*h || visited[idx]) continue;
    visited[idx] = 1;
    if (cdist(idx*4) <= tol) {
      mask[idx] = 1;
      const x=idx%w, y=Math.floor(idx/w);
      if (x>0)   stack.push(idx-1);
      if (x<w-1) stack.push(idx+1);
      if (y>0)   stack.push(idx-w);
      if (y<h-1) stack.push(idx+w);
    }
  }

  // Global pass: zap remaining near-white/near-bg isolated pixels
  if (bgLuma > 200) {
    for (let i=0; i<w*h; i++) {
      if (mask[i]) continue;
      const px=i*4, sat=Math.max(d[px],d[px+1],d[px+2])-Math.min(d[px],d[px+1],d[px+2]);
      const luma=d[px]*0.299+d[px+1]*0.587+d[px+2]*0.114;
      if (luma > 242 && sat < 10) mask[i] = 1;
    }
  }

  // Apply mask + feather edges
  for (let y=0; y<h; y++) {
    for (let x=0; x<w; x++) {
      const idx=y*w+x;
      if (!mask[idx]) continue;
      d[idx*4+3] = 0;
      for (const [nx,ny] of [[x-1,y],[x+1,y],[x,y-1],[x,y+1],[x-1,y-1],[x+1,y-1],[x-1,y+1],[x+1,y+1]]) {
        if (nx<0||nx>=w||ny<0||ny>=h) continue;
        const ni=ny*w+nx;
        if (!mask[ni]) d[ni*4+3] = Math.min(d[ni*4+3], 180);
      }
    }
  }
  ctx.putImageData(id, 0, 0);
}

// ── UPDATE UI when image finishes loading ─────────────────
function applyImageToUI(pedalId, dataUrl) {
  if (!dataUrl || dataUrl === 'FAILED') return;
  // Update library icon
  const libIcon = document.querySelector(`.lib-pedal[data-id="${pedalId}"] .lib-icon`);
  if (libIcon) {
    libIcon.innerHTML = `<img src="${dataUrl}" style="width:100%;height:100%;object-fit:contain;filter:url(#cartoon) saturate(2) contrast(1.3)" alt="">`;
  }
  // Update any board cards currently showing shimmer/fallback
  document.querySelectorAll(`.board-pedal[data-zone]`).forEach(wrapper => {
    const allZone = wrapper.dataset.zone === 'pre' ? prePedals : fxPedals;
    const idx = parseInt(wrapper.dataset.idx);
    if (allZone[idx] === pedalId) {
      const card = wrapper.querySelector('.pedal-card');
      if (card && !card.querySelector('.pedal-real-img')) {
        card.innerHTML = `<img src="${dataUrl}" class="pedal-real-img" alt="">`;
      }
    }
  });
}

// ── PRE-WARM all built-in pedals on startup ───────────────
function prewarmImages() {
  PEDALS.forEach((p, i) => {
    // Already in memory or localStorage cache?
    if (imgCache[p.id] && imgCache[p.id] !== 'FAILED') return;
    try {
      const v = localStorage.getItem(imgKey(p.id));
      if (v) { imgCache[p.id] = v; applyImageToUI(p.id, v); return; }
    } catch(e) {}
    // Schedule staggered fetch — 600ms apart to stay under rate limits
    setTimeout(() => {
      loadPedalImage(p).then(url => {
        if (url) applyImageToUI(p.id, url);
      });
    }, i * 600);
  });
}

// ── RENDER BOARD ─────────────────────────────────────────
function renderBoard(){
  const sz=SIZES[currentSize];
  ['board-surface','fx-loop-surface'].forEach((id,i)=>{
    const s=document.getElementById(id);
    s.style.width=sz.w+'px';s.style.minHeight=(i===1?Math.round(sz.h*.75):sz.h)+'px';
    multiRow?s.classList.add('multi-row'):s.classList.remove('multi-row');
  });
  renderZone('pre');renderZone('fx');
  renderRoutingBar('pre');renderRoutingBar('fx');

  document.getElementById('board-dim').textContent=sz.dim;
  document.getElementById('pedal-count').textContent=`${tot} pedal${tot!==1?'s':''} · ${prePedals.length} pre · ${fxPedals.length} loop`;

}

async function renderZone(zone){
  const isPre=zone==='pre';
  const ids=isPre?prePedals:fxPedals;
  const rowEl=document.getElementById(isPre?'pedals-row':'fx-pedals-row');
  const emptyEl=document.getElementById(isPre?'empty-pre':'empty-fx');
  emptyEl.classList.toggle('hidden',ids.length>0);
  rowEl.innerHTML='';
  for(let idx=0;idx<ids.length;idx++){
    const pid=ids[idx];const pedal=allPedals().find(p=>p.id===pid);if(!pedal)continue;
    // Input jumper (before first pedal, dimmed)
    if(idx===0){const jw=document.createElement('div');jw.className='jumper-wrap';jw.style.opacity='.4';jw.innerHTML=makeJumperSVG(0,zone);rowEl.appendChild(jw)}
    // Pedal wrapper
    const wrapper=document.createElement('div');wrapper.className='board-pedal';wrapper.draggable=true;wrapper.dataset.idx=idx;wrapper.dataset.zone=zone;
    // Card
    const card=document.createElement('div');card.className='pedal-card';card.style.background=pedal.bodyColor+'14';
    const cached=imgCache[pedal.id];
    if(cached&&cached!=='FAILED'){const img=document.createElement('img');img.src=cached;img.className='pedal-real-img';img.alt=pedal.name;card.appendChild(img)}
    else if(cached==='FAILED'){const fb=document.createElement('div');fb.className='pedal-svg-fallback';fb.innerHTML=makePedalSVG(pedal,84,124);card.appendChild(fb)}
    else{
      const sh=document.createElement('div');sh.className='pedal-loading';sh.innerHTML=`<div class="pedal-loading-icon">${makePedalSVG(pedal,50,74)}</div>`;card.appendChild(sh);
      loadPedalImage(pedal).then(url=>{
        if(!card.isConnected)return;card.innerHTML='';
        if(url){const img=document.createElement('img');img.src=url;img.className='pedal-real-img';img.alt=pedal.name;card.appendChild(img)}
        else{const fb=document.createElement('div');fb.className='pedal-svg-fallback';fb.innerHTML=makePedalSVG(pedal,84,124);card.appendChild(fb)}
      });
    }
    wrapper.appendChild(card);
    // Badge
    const badge=document.createElement('div');badge.className=`pedal-badge ${isPre?'badge-pre':'badge-fx'}`;badge.textContent=idx+1;wrapper.appendChild(badge);
    // Remove
    const rm=document.createElement('div');rm.className='pedal-remove';rm.innerHTML='✕';rm.addEventListener('click',e=>{e.stopPropagation();removeFromZone(idx,zone)});wrapper.appendChild(rm);
    wrapper.addEventListener('mouseenter',()=>showInfo(pedal,zone));wrapper.addEventListener('mouseleave',hideInfo);
    wrapper.addEventListener('dragstart',e=>{dragSrcZone=zone;dragSrcIdx=idx;dragLibId=null;wrapper.classList.add('dragging-board');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',pid)});
    wrapper.addEventListener('dragend',()=>wrapper.classList.remove('dragging-board'));
    wrapper.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect=dragSrcZone?'move':'copy'});
    wrapper.addEventListener('drop',e=>{e.preventDefault();handleDropOnPedal(idx,zone)});
    rowEl.appendChild(wrapper);
    // Jumper between / after
    const jw=document.createElement('div');jw.className='jumper-wrap';if(idx>=ids.length-1)jw.style.opacity='.4';jw.innerHTML=makeJumperSVG(idx+1,zone);rowEl.appendChild(jw);
  }
}

function renderRoutingBar(zone){
  const ids=zone==='pre'?prePedals:fxPedals;
  const bar=document.getElementById(`routing-${zone}-bar`);
  bar.style.display=(!showRouting||ids.length===0)?'none':'flex';
  if(!showRouting||!ids.length)return;
  bar.innerHTML='';
  ids.forEach((pid,idx)=>{
    const p=allPedals().find(x=>x.id===pid);if(!p)return;
    if(idx>0){const a=document.createElement('div');a.className=`rarr ${zone==='pre'?'rarr-pre':'rarr-fx'}`;a.textContent='▶';bar.appendChild(a)}
    const n=document.createElement('div');n.className='rnode rnode-pedal';
    const sn=(p.name.replace(p.brand,'').trim()||p.name).substring(0,12);
    n.innerHTML=`<span class="rnum">${idx+1}</span>${sn}`;n.title=`${p.brand} ${p.name}`;bar.appendChild(n);
  });
}

// ── DRAG & DROP ZONES ────────────────────────────────────
function setupDrop(surfaceId,zone){
  const el=document.getElementById(surfaceId);
  el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drag-over')});
  el.addEventListener('dragleave',e=>{if(!el.contains(e.relatedTarget))el.classList.remove('drag-over')});
  el.addEventListener('drop',e=>{
    e.preventDefault();el.classList.remove('drag-over');
    if(dragLibId!==null){addToZone(dragLibId,zone);dragLibId=null}
    else if(dragSrcZone!==null&&dragSrcZone!==zone){
      const src=dragSrcZone==='pre'?prePedals:fxPedals;
      const[m]=src.splice(dragSrcIdx,1);
      (zone==='pre'?prePedals:fxPedals).push(m);
      dragSrcZone=null;dragSrcIdx=null;renderBoard();
    }
  });
}
setupDrop('board-surface','pre');setupDrop('fx-loop-surface','fx');

function handleDropOnPedal(targetIdx,targetZone){
  const tArr=targetZone==='pre'?prePedals:fxPedals;
  if(dragLibId!==null){tArr.splice(targetIdx,0,dragLibId);dragLibId=null;renderBoard();return}
  if(dragSrcZone!==null&&dragSrcIdx!==null){
    const sArr=dragSrcZone==='pre'?prePedals:fxPedals;
    if(dragSrcZone===targetZone){const[m]=sArr.splice(dragSrcIdx,1);sArr.splice(dragSrcIdx<targetIdx?targetIdx-1:targetIdx,0,m)}
    else{const[m]=sArr.splice(dragSrcIdx,1);tArr.splice(targetIdx,0,m)}
    dragSrcZone=null;dragSrcIdx=null;renderBoard();
  }
}
function removeFromZone(idx,zone){(zone==='pre'?prePedals:fxPedals).splice(idx,1);renderBoard()}
function addToZone(id,zone){
  const max=SIZES[currentSize].max;
  if(prePedals.length+fxPedals.length>=max){showToast(`Board full — max ${max} pedals`,'error');return}
  (zone==='pre'?prePedals:fxPedals).push(id);renderBoard();
  showToast(`Added to ${zone==='pre'?'Pre-Amp Chain':'FX Loop'} ✓`,'success');
}

// ── PEDAL SEARCH via Anthropic API ───────────────────────
async function searchPedals(query) {
  const status = document.getElementById('search-status');
  const results = document.getElementById('search-results');
  results.innerHTML = '';
  status.innerHTML = '<span class="spinner"></span>Searching Sweetwater &amp; Guitar Center…';

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 800,
        tools: [{ type: 'web_search_20250305', name: 'web_search' }],
        messages: [{
          role: 'user',
          content: `Search sweetwater.com and guitarcenter.com for guitar effects pedals matching "${query}". Return ONLY a raw JSON array (no markdown fences, no explanation) of up to 6 matching pedals. Each object must have exactly these keys: "name" (full product name string), "brand" (manufacturer string), "category" (exactly one of: overdrive, distortion, fuzz, delay, reverb, modulation, filter, compressor, utility, ambient). Example format: [{"name":"Boss DS-1 Distortion","brand":"Boss","category":"distortion"}]`
        }]
      })
    });
    if (resp.ok) {
      const data = await resp.json();
      const txt = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
      const m = txt.match(/\[[\s\S]*?\]/);
      if (m) {
        let parsed = [];
        try { parsed = JSON.parse(m[0]); } catch(e) {}
        if (Array.isArray(parsed) && parsed.length > 0) {
          const seen = new Set();
          const clean = parsed
            .filter(p => p && typeof p.name === 'string' && p.name.length > 2)
            .filter(p => { if (seen.has(p.name)) return false; seen.add(p.name); return true; })
            .slice(0, 8);
          if (clean.length > 0) {
            status.innerHTML = `${clean.length} results found`;
            showSearchResults(clean);
            return;
          }
        }
      }
    }
  } catch(e) {}

  status.innerHTML = 'Showing built-in matches';
  showFallback(query);
}

function showSearchResults(items) {
  const results = document.getElementById('search-results');
  results.innerHTML = '';
  items.forEach(item => {
    const cat = CATS[item.category] ? item.category : guessCat(item.name);
    const uid = 'custom_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
    const tmp = {
      id: uid,
      name: (item.name || '').substring(0, 50),
      brand: item.brand || extractBrand(item.name),
      cat,
      bodyColor: guessCatColor(item.name),
      textColor: '#fff',
      knobs: guessKnobs(item.name),
      accent: '#e8e8e8'
    };
    const div = document.createElement('div');
    div.className = 'sri';
    div.innerHTML = `
      <div class="sri-svg" id="sri-icon-${uid}">${makePedalSVG(tmp, 42, 58)}</div>
      <div style="flex:1;min-width:0">
        <div class="sri-name">${tmp.name}</div>
        <div class="sri-brand">${tmp.brand}</div>
        <div class="sri-cat" style="color:${CATS[cat]?.color||'#888'}">${CATS[cat]?.label||cat}</div>
      </div>
      <button class="sri-add">+ ADD</button>`;
    div.querySelector('.sri-add').addEventListener('click', () => {
      const finalId = 'custom_' + Date.now();
      tmp.id = finalId;
      customPedals.push({ ...tmp });
      renderLibrary(document.getElementById('lib-search').value);
      addToZone(finalId, addDest);
      loadPedalImage(tmp).then(url => { if (url) { imgCache[finalId] = url; applyImageToUI(finalId, url); } });
      closeModal();
    });
    results.appendChild(div);
    // Load preview image async
    loadPedalImage(tmp).then(url => {
      if (!url) return;
      const el = document.getElementById(`sri-icon-${uid}`);
      if (el) el.innerHTML = `<img src="${url}" style="width:42px;height:58px;object-fit:contain;filter:url(#cartoon) saturate(2) contrast(1.3)" alt="">`;
    });
  });
}
function showFallback(query){
  const lq=query.toLowerCase(),results=document.getElementById('search-results');
  const matches=allPedals().filter(p=>p.name.toLowerCase().includes(lq)||p.brand.toLowerCase().includes(lq)).slice(0,8);
  if(!matches.length){results.innerHTML='<div style="color:var(--muted);font-family:var(--font-m);font-size:11px;padding:10px">No matches found.</div>';return}
  results.innerHTML='';
  matches.forEach(p=>{
    const div=document.createElement('div');div.className='sri';
    div.innerHTML=`<div class="sri-svg">${makePedalSVG(p,42,58)}</div><div style="flex:1;min-width:0"><div class="sri-name">${p.name}</div><div class="sri-brand">${p.brand}</div><div class="sri-cat" style="color:${CATS[p.cat].color}">${CATS[p.cat].label}</div></div><button class="sri-add">+ ADD</button>`;
    div.querySelector('.sri-add').addEventListener('click',()=>{addToZone(p.id,addDest);closeModal()});
    results.appendChild(div);
  });
}
function guessCat(n){n=n.toLowerCase();
  if(n.includes('reverb')||n.includes('spring'))return'reverb';
  if(n.includes('delay')||n.includes('echo'))return'delay';
  if(n.includes('chorus')||n.includes('flanger')||n.includes('phase')||n.includes('tremolo'))return'modulation';
  if(n.includes('fuzz')||n.includes('muff'))return'fuzz';
  if(n.includes('distortion')||n.includes('metal'))return'distortion';
  if(n.includes('overdrive')||n.includes('screamer')||n.includes('boost'))return'overdrive';
  if(n.includes('wah')||n.includes('filter')||n.includes('envelope'))return'filter';
  if(n.includes('comp'))return'compressor';
  if(n.includes('tuner')||n.includes('looper')||n.includes('noise'))return'utility';
  return'overdrive';
}
function guessCatColor(n){const m={reverb:'#17a89e',delay:'#1a6be8',modulation:'#22a84e',fuzz:'#9922cc',distortion:'#cc2222',overdrive:'#e8621a',filter:'#d4aa00',compressor:'#607080',utility:'#404555'};return m[guessCat(n)]||'#607080'}
function guessKnobs(n){n=n.toLowerCase();if(n.includes('reverb'))return['Decay','Mix','Tone'];if(n.includes('delay'))return['Time','Mix','Feedback'];if(n.includes('comp'))return['Sustain','Level','Attack'];return['Drive','Tone','Level']}
function extractBrand(name){const bs=['Boss','MXR','Strymon','Electro-Harmonix','EHX','Ibanez','Dunlop','ProCo','TC Electronic','Keeley','ZVex','Chase Bliss Audio','Red Panda','Fulltone','Walrus Audio','JHS','Way Huge','Earthquaker Devices','Digitech','Line 6'];for(const b of bs)if(name.toLowerCase().includes(b.toLowerCase()))return b;return name.split(' ')[0]}

// ── MODAL ────────────────────────────────────────────────
function openModal(){document.getElementById('modal-overlay').classList.add('open')}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');document.getElementById('search-results').innerHTML='';document.getElementById('search-status').innerHTML='';document.getElementById('modal-search-input').value=''}
document.getElementById('btn-add-pedal').addEventListener('click',openModal);
document.getElementById('modal-close').addEventListener('click',closeModal);
document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target===document.getElementById('modal-overlay'))closeModal()});
document.getElementById('modal-search-btn').addEventListener('click',()=>{const q=document.getElementById('modal-search-input').value.trim();if(q)searchPedals(q)});
document.getElementById('modal-search-input').addEventListener('keydown',e=>{if(e.key==='Enter'){const q=e.target.value.trim();if(q)searchPedals(q)}});
document.querySelectorAll('.dest-btn').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.dest-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');addDest=btn.dataset.dest}));

// ── CONTROLS ─────────────────────────────────────────────
document.getElementById('board-size-select').addEventListener('change',e=>{
  currentSize=e.target.value;const max=SIZES[currentSize].max;
  if(prePedals.length+fxPedals.length>max){const k=Math.floor(max*.6);prePedals=prePedals.slice(0,k);fxPedals=fxPedals.slice(0,max-k);showToast(`Resized — trimmed to ${max} pedals`,'error')}
  renderBoard();
});
document.querySelectorAll('.layout-btn').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.layout-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');multiRow=btn.dataset.rows==='2';renderBoard()}));
document.getElementById('btn-routing').addEventListener('click',()=>{showRouting=!showRouting;document.getElementById('btn-routing').classList.toggle('active',showRouting);renderBoard()});
document.getElementById('btn-clear').addEventListener('click',()=>{if(!prePedals.length&&!fxPedals.length)return;if(confirm('Clear all pedals from the board?')){prePedals=[];fxPedals=[];renderBoard()}});
document.getElementById('lib-search').addEventListener('input',e=>renderLibrary(e.target.value));

// ── EXPORT ───────────────────────────────────────────────
document.getElementById('btn-export').addEventListener('click',async()=>{
  const btn=document.getElementById('btn-export');btn.textContent='⏳ Rendering…';btn.disabled=true;
  try{const el=document.getElementById('pedalboard');const canvas=await html2canvas(el,{backgroundColor:'#07070a',scale:2,useCORS:true,logging:false,allowTaint:true});const a=document.createElement('a');a.download='pedalboard.png';a.href=canvas.toDataURL('image/png');a.click();showToast('PNG exported! ✓','success')}
  catch(e){showToast('Export failed — try a different browser','error')}
  btn.innerHTML='⬇ <span>Export PNG</span>';btn.disabled=false;
});

// ── SAVE / LOAD ──────────────────────────────────────────
function saveState(){try{localStorage.setItem('pf3_pre',JSON.stringify(prePedals));localStorage.setItem('pf3_fx',JSON.stringify(fxPedals));localStorage.setItem('pf3_size',currentSize);localStorage.setItem('pf3_custom',JSON.stringify(customPedals))}catch(e){}}
function loadState(){
  try{
    prePedals=JSON.parse(localStorage.getItem('pf3_pre')||'[]');
    fxPedals=JSON.parse(localStorage.getItem('pf3_fx')||'[]');
    customPedals=JSON.parse(localStorage.getItem('pf3_custom')||'[]');
    const s=localStorage.getItem('pf3_size');if(s&&SIZES[s]){currentSize=s;document.getElementById('board-size-select').value=s}
    // Pre-warm image cache from localStorage (versioned key)
    allPedals().forEach(p => {
      try { const v = localStorage.getItem(imgKey(p.id)); if (v) imgCache[p.id] = v; } catch(e) {}
    });
  }catch(e){prePedals=[];fxPedals=[]}
}

// ── INIT ─────────────────────────────────────────────────
loadState();
renderLibrary();
renderBoard();
document.getElementById('btn-routing').classList.add('active');
// Kick off background image pre-warming for all built-in pedals
setTimeout(prewarmImages, 800);
</script>
</body>
</html>
