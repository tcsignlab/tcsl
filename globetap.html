<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MapTag Ultimate</title>

<script src="https://unpkg.com/three"></script>
<script src="https://unpkg.com/globe.gl"></script>
<script src="https://unpkg.com/topojson-client@3"></script>

<style>
body { margin:0; font-family:Arial; background:#000; overflow:hidden; color:#fff;}
#globeViz { position:absolute; width:100%; height:100%; }

.glass {
  background:rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  border-radius:12px;
  padding:12px;
}

#ui { position:absolute; top:15px; left:15px; z-index:10; }

#controls {
  position:absolute; bottom:20px; left:50%;
  transform:translateX(-50%);
  display:flex; gap:10px;
}

button {
  padding:10px 14px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

#center {
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}

#timer { font-size:22px; margin-top:5px; }

#resultPopup {
  position:absolute;
  top:20%;
  left:50%;
  transform:translateX(-50%);
  font-size:28px;
  font-weight:bold;
  display:none;
}
</style>
</head>

<body>

<div id="globeViz"></div>

<div id="ui" class="glass">
  <div id="score">Score: 0</div>
  <div id="streak">Streak: 0 🔥</div>
  <div id="target"></div>
  <div id="timer">⏱️ 10</div>
</div>

<div id="controls">
  <button onclick="restartGame()">🔄 Restart</button>
  <button onclick="quitGame()">❌ Quit</button>
  <button onclick="share()">📤 Share</button>
</div>

<div id="center">
  <h1>🌍 MAPTAG ULTIMATE</h1>
  <p>Click as close as possible to the target city.</p>
  <p>Closer = more points. Build streaks 🔥</p>
  <p id="highScore"></p>
  <p id="leaderboard"></p>
  <button onclick="startGame()">Start Game</button>
</div>

<div id="resultPopup"></div>

<script>
const globe = Globe()(document.getElementById('globeViz'))
  .globeImageUrl('https://eoimages.gsfc.nasa.gov/images/imagerecords/57000/57730/land_ocean_ice_cloud_2048.jpg')
  .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
  .backgroundColor('#000');

// ===== COUNTRY BORDERS =====
let countries = [];
let hoveredCountry = null;
let targetCountry = null;

fetch('https://unpkg.com/world-atlas@2/countries-110m.json')
.then(res => res.json())
.then(worldData => {
  countries = topojson.feature(worldData, worldData.objects.countries).features;

  globe
    .polygonsData(countries)
    .polygonCapColor(d => {
      if (d === targetCountry) return "rgba(0,255,100,0.6)";
      if (d === hoveredCountry) return "rgba(255,255,255,0.3)";
      return "rgba(0,0,0,0)";
    })
    .polygonSideColor(() => "rgba(0,100,255,0.15)")
    .polygonStrokeColor(() => "#00aaff")
    .polygonAltitude(d => d === hoveredCountry ? 0.02 : 0.005);
});

globe.onPolygonHover(d => hoveredCountry = d);

// ===== CITY DATA =====
let cities = [];
let usedCities = JSON.parse(localStorage.getItem("usedCities")||"[]");

let roundCities=[], index=0, score=0, streak=0;
let timerInterval, timeLeft=10;

fetch('https://raw.githubusercontent.com/jetsetexpert/world-cities-json/master/data/cities.json')
.then(r=>r.json())
.then(d=> cities = d.filter(c=>c.population>100000));

// ===== GET CITIES =====
function getCities(){
  let available = cities.filter(c=>!usedCities.includes(c.name));
  if(available.length<5){ usedCities=[]; available=cities;}

  let sel=[];
  while(sel.length<5){
    let r = available[Math.floor(Math.random()*available.length)];
    if(!sel.includes(r)) sel.push(r);
  }

  usedCities.push(...sel.map(c=>c.name));
  localStorage.setItem("usedCities", JSON.stringify(usedCities));

  return sel;
}

// ===== DISTANCE =====
function dist(a,b,c,d){
  const R=6371;
  const dLat=(c-a)*Math.PI/180;
  const dLon=(d-b)*Math.PI/180;
  const x=Math.sin(dLat/2)**2 +
    Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*
    Math.sin(dLon/2)**2;
  return R*(2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)));
}

// ===== GAME FLOW =====
function startGame(){
  document.getElementById("center").style.display="none";
  score=0; streak=0; index=0;
  roundCities=getCities();
  next();
}

function restartGame(){
  score=0; streak=0; index=0;
  roundCities=getCities();
  updateUI();
  next();
}

function quitGame(){
  document.getElementById("center").style.display="block";
  globe.pointsData([]);
  globe.arcsData([]);
  clearInterval(timerInterval);
}

// ===== NEXT ROUND =====
function next(){
  if(index>=5) return end();

  let c=roundCities[index];

  document.getElementById("target").innerText =
    "Find: "+c.name+", "+c.country;

  targetCountry = countries.find(ct =>
    ct.properties.name === c.country
  );

  globe.pointOfView({lat:c.lat,lng:c.lng,altitude:2},1500);

  startTimer();
}

// ===== TIMER =====
function startTimer(){
  clearInterval(timerInterval);
  timeLeft=10;
  document.getElementById("timer").innerText="⏱️ "+timeLeft;

  timerInterval=setInterval(()=>{
    timeLeft--;
    document.getElementById("timer").innerText="⏱️ "+timeLeft;
    if(timeLeft<=0){
      clearInterval(timerInterval);
      handleGuess(null);
    }
  },1000);
}

// ===== PIN DROP =====
function dropPin(lat, lng, color){
  let altitude = 1;

  let fall = setInterval(()=>{
    altitude -= 0.08;

    globe.pointsData([{
      lat, lng,
      size: 0.5,
      color,
      altitude: Math.max(altitude,0)
    }]);

    if(altitude <= 0){
      clearInterval(fall);

      let bounce = 0.15;
      let b = setInterval(()=>{
        bounce -= 0.02;

        globe.pointsData([{
          lat, lng,
          size: 0.5,
          color,
          altitude: bounce
        }]);

        if(bounce <= 0) clearInterval(b);
      },20);
    }
  },20);
}

// ===== CLICK =====
globe.onGlobeClick(({lat,lng})=>{
  handleGuess({lat,lng});
});

// ===== HANDLE GUESS =====
function handleGuess(pos){
  clearInterval(timerInterval);

  let c=roundCities[index];
  let d = pos ? dist(pos.lat,pos.lng,c.lat,c.lng) : 20000;

  let pts = Math.max(0,5000 - d*10);

  if(d<500) streak++; else streak=0;
  score += Math.round(pts + streak*200);

  if(pos) dropPin(pos.lat,pos.lng,'red');
  dropPin(c.lat,c.lng,'lime');

  if(pos){
    globe.arcsData([{
      startLat:pos.lat,startLng:pos.lng,
      endLat:c.lat,endLng:c.lng
    }]);
  }

  showResult(Math.round(d), Math.round(pts));

  index++;
  updateUI();

  setTimeout(next,2500);
}

// ===== UI =====
function updateUI(){
  document.getElementById("score").innerText="Score: "+score;
  document.getElementById("streak").innerText="Streak: "+streak+" 🔥";
}

function showResult(d, pts){
  let el=document.getElementById("resultPopup");
  el.style.display="block";
  el.innerText = d+" km | +"+pts+" pts";
  setTimeout(()=> el.style.display="none",2000);
}

// ===== END =====
function end(){
  let high = localStorage.getItem("highScore")||0;
  if(score>high) localStorage.setItem("highScore",score);

  let board = JSON.parse(localStorage.getItem("scores")||"[]");
  board.push(score);
  board.sort((a,b)=>b-a);
  board=board.slice(0,5);

  localStorage.setItem("scores", JSON.stringify(board));

  document.getElementById("leaderboard").innerText =
    "Top: "+board.join(", ");

  document.getElementById("highScore").innerText =
    "High Score: "+localStorage.getItem("highScore");

  document.getElementById("center").style.display="block";
}

// ===== SHARE =====
function share(){
  navigator.clipboard.writeText("I scored "+score+" 🌍");
  alert("Copied!");
}

// INIT
document.getElementById("highScore").innerText =
  "High Score: "+(localStorage.getItem("highScore")||0);
</script>

</body>
</html>
