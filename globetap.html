    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Bebas Neue', Impact, sans-serif;
            background: #000;
        }

        #root {
            width: 100vw;
            height: 100vh;
        }

        #globe-container {
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        #globe-container.dragging {
            cursor: grabbing;
        }

        .stars {
            position: absolute;
            inset: 0;
            background: #000;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle linear infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
    </style>
</head>

        // Stars background component
        const StarsBackground = () => {
            useEffect(() => {
                const container = document.querySelector('.stars');
                if (!container) return;

                // Create 200 stars
                for (let i = 0; i < 200; i++) {
                    const star = document.createElement('div');

        };

        const MapTagGame = () => {
            const [gameState, setGameState] = useState('intro');
            const [currentRound, setCurrentRound] = useState(0);
            const [gameCities, setGameCities] = useState([]);
            const [guesses, setGuesses] = useState([]);
            const [totalScore, setTotalScore] = useState(0);
            const [highScore, setHighScore] = useState(0);
            const [usedCities, setUsedCities] = useState([]);
            const [currentGuess, setCurrentGuess] = useState(null);
            const [citiesDatabase, setCitiesDatabase] = useState(FALLBACK_CITIES);
            const [loadingCities, setLoadingCities] = useState(true);
            
            const globeContainerRef = useRef(null);
            const sceneRef = useRef(null);
            const cameraRef = useRef(null);
            const rendererRef = useRef(null);
            const globeRef = useRef(null);
            const animationIdRef = useRef(null);
            const isDraggingRef = useRef(false);
            const previousMousePositionRef = useRef({ x: 0, y: 0 });
            const markersRef = useRef([]);
            const clickStartPosRef = useRef(null);

            // Load cities from public API on mount
            useEffect(() => {
                const loadCities = async () => {
                    try {
                        // Using SimpleMaps free world cities database
                        const response = await fetch('https://raw.githubusercontent.com/datasets/world-cities/master/data/world-cities.csv');
                        const text = await response.text();
                        
                        // Parse CSV
                        const lines = text.split('\n').slice(1); // Skip header
                        const cities = [];
                        
                        for (let line of lines) {
                            if (!line.trim()) continue;
                            
                            // Simple CSV parsing (handles quoted fields)
                            const match = line.match(/^"([^"]*)","([^"]*)","([^"]*)","([^"]*)",([^,]*),([^,]*)/);
                            if (match) {
                                const [, name, country, subcountry, , lat, lng] = match;
                                
                                // Filter for cities with population > 500k or capitals
                                if (name && lat && lng) {
                                    cities.push({
                                        name: name,
                                        country: country,
                                        lat: parseFloat(lat),
                                        lng: parseFloat(lng)
                                    });
                                }
                            }
                        }
                        
                        // Shuffle and take 500 cities
                        const shuffled = cities.sort(() => Math.random() - 0.5);
                        const selected = shuffled.slice(0, Math.min(500, shuffled.length));
                        
                        if (selected.length > 0) {
                            setCitiesDatabase(selected);
                            console.log(`Loaded ${selected.length} cities from public database`);
                        }
                    } catch (error) {
                        console.error('Failed to load cities, using fallback:', error);
                        setCitiesDatabase(FALLBACK_CITIES);
                    } finally {
                        setLoadingCities(false);
                    }
                };

                loadCities();

                const savedHighScore = localStorage.getItem('maptag-highscore');
                const savedUsedCities = localStorage.getItem('maptag-used-cities');
                
                if (savedHighScore) setHighScore(parseInt(savedHighScore));
                if (savedUsedCities) setUsedCities(JSON.parse(savedUsedCities));
            }, []);

            useEffect(() => {
                if (gameState === 'playing' && globeContainerRef.current && !sceneRef.current) {
                    initGlobe();
                }

                return () => {
                    if (animationIdRef.current) {
                        cancelAnimationFrame(animationIdRef.current);
                    }
                    if (rendererRef.current && globeContainerRef.current) {
                        const canvas = rendererRef.current.domElement;
                        if (canvas && canvas.parentNode) {
                            canvas.parentNode.removeChild(canvas);
                        }
                        rendererRef.current.dispose();
                        rendererRef.current = null;
                    }
                    sceneRef.current = null;
                    globeRef.current = null;
                };
            }, [gameState]);

            const initGlobe = () => {
                const container = globeContainerRef.current;
                if (!container) return;
                
                const width = container.clientWidth;
                const height = container.clientHeight;

                // Scene
                const scene = new THREE.Scene();
                sceneRef.current = scene;

                // Camera
                const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
                camera.position.z = 3;
                cameraRef.current = camera;

                // Renderer
                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(width, height);
                renderer.setPixelRatio(window.devicePixelRatio);
                container.appendChild(renderer.domElement);
                rendererRef.current = renderer;

                // Lighting
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                scene.add(ambientLight);

                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(5, 3, 5);
                scene.add(directionalLight);

                // Create Earth globe
                const geometry = new THREE.SphereGeometry(1, 64, 64);
                const material = new THREE.MeshPhongMaterial({
                    color: 0x2233ff,
                    emissive: 0x112244,
                    shininess: 10
                });
                
                const globe = new THREE.Mesh(geometry, material);
                globeRef.current = globe;
                scene.add(globe);

                // Load texture
                const textureLoader = new THREE.TextureLoader();
                textureLoader.load(
                    'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg',
                    (texture) => {
                        globe.material.map = texture;
                        globe.material.needsUpdate = true;
                    }
                );

                // Mouse/Touch controls
                const canvas = renderer.domElement;
                
                const handleMouseDown = (e) => {
                    isDraggingRef.current = false;
                    clickStartPosRef.current = { x: e.clientX, y: e.clientY };
                    previousMousePositionRef.current = { x: e.clientX, y: e.clientY };
                    container.classList.add('dragging');
                };

                const handleMouseMove = (e) => {
                    if (!clickStartPosRef.current) return;
                    
                    const deltaX = Math.abs(e.clientX - clickStartPosRef.current.x);
                    const deltaY = Math.abs(e.clientY - clickStartPosRef.current.y);
                    
                    if (deltaX > 5 || deltaY > 5) {
                        isDraggingRef.current = true;
                    }

                    if (!globeRef.current) return;

                    const moveX = e.clientX - previousMousePositionRef.current.x;
                    const moveY = e.clientY - previousMousePositionRef.current.y;

                    globeRef.current.rotation.y += moveX * 0.005;
                    globeRef.current.rotation.x += moveY * 0.005;

                    previousMousePositionRef.current = { x: e.clientX, y: e.clientY };
                };

                const handleMouseUp = (e) => {
                    container.classList.remove('dragging');
                    
                    // Only process click if not dragging
                    if (!isDraggingRef.current && clickStartPosRef.current) {
                        handleGlobeClick(e);
                    }
                    
                    isDraggingRef.current = false;
                    clickStartPosRef.current = null;
                };

                const handleTouchStart = (e) => {
                    if (e.touches.length === 1) {
                        isDraggingRef.current = false;
                        clickStartPosRef.current = {
                            x: e.touches[0].clientX,
                            y: e.touches[0].clientY
                        };
                        previousMousePositionRef.current = {
                            x: e.touches[0].clientX,
                            y: e.touches[0].clientY
                        };
                        container.classList.add('dragging');
                    }
                };

                const handleTouchMove = (e) => {
                    e.preventDefault();
                    if (e.touches.length !== 1 || !clickStartPosRef.current) return;

                    const deltaX = Math.abs(e.touches[0].clientX - clickStartPosRef.current.x);
                    const deltaY = Math.abs(e.touches[0].clientY - clickStartPosRef.current.y);
                    
                    if (deltaX > 5 || deltaY > 5) {
                        isDraggingRef.current = true;
                    }

                    if (!globeRef.current) return;

                    const moveX = e.touches[0].clientX - previousMousePositionRef.current.x;
                    const moveY = e.touches[0].clientY - previousMousePositionRef.current.y;

                    globeRef.current.rotation.y += moveX * 0.005;
                    globeRef.current.rotation.x += moveY * 0.005;

                    previousMousePositionRef.current = {
                        x: e.touches[0].clientX,
                        y: e.touches[0].clientY
                    };
                };

                const handleTouchEnd = (e) => {
                    container.classList.remove('dragging');
                    
                    if (!isDraggingRef.current && clickStartPosRef.current && e.changedTouches.length > 0) {
                        const touch = e.changedTouches[0];
                        handleGlobeClick({ 
                            clientX: touch.clientX, 
                            clientY: touch.clientY,
                            target: canvas 
                        });
                    }
                    
                    isDraggingRef.current = false;
                    clickStartPosRef.current = null;
                };

                const handleGlobeClick = (e) => {
                    // Check if we can process this click
                    if (currentRound >= gameCities.length || currentGuess || !globeRef.current) {
                        console.log('Click ignored:', { currentRound, hasGuess: !!currentGuess, hasGlobe: !!globeRef.current });
                        return;
                    }

                    const rect = canvas.getBoundingClientRect();
                    const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                    const y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

                    const raycaster = new THREE.Raycaster();
                    raycaster.setFromCamera(new THREE.Vector2(x, y), cameraRef.current);

                    const intersects = raycaster.intersectObject(globeRef.current);

                    if (intersects.length > 0) {
                        const point = intersects[0].point;
                        
                        // Convert 3D point to lat/lng
                        const radius = Math.sqrt(point.x * point.x + point.y * point.y + point.z * point.z);
                        const lat = 90 - (Math.acos(point.y / radius) * 180 / Math.PI);
                        const lng = ((270 + (Math.atan2(point.x, point.z)) * 180 / Math.PI) % 360) - 180;

                        console.log('Click registered:', { lat, lng });
                        handleGuess(lat, lng);
                    }
                };
                
                canvas.addEventListener('mousedown', handleMouseDown);
                canvas.addEventListener('mousemove', handleMouseMove);
                canvas.addEventListener('mouseup', handleMouseUp);
                
                canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
                canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
                canvas.addEventListener('touchend', handleTouchEnd);

                // Handle window resize
                const handleResize = () => {
                    if (!container || !camera || !renderer) return;
                    const newWidth = container.clientWidth;
                    const newHeight = container.clientHeight;
                    camera.aspect = newWidth / newHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(newWidth, newHeight);
                };
                window.addEventListener('resize', handleResize);

                // Animation loop
                const animate = () => {
                    animationIdRef.current = requestAnimationFrame(animate);
                    
                    if (globeRef.current && !clickStartPosRef.current) {
                        globeRef.current.rotation.y += 0.001;
                    }
                    
                    if (renderer && scene && camera) {
                        renderer.render(scene, camera);
                    }
                };
                animate();
            };

            const latLngToVector3 = (lat, lng, radius = 1) => {
                const phi = (90 - lat) * (Math.PI / 180);
                const theta = (lng + 180) * (Math.PI / 180);

                const x = -(radius * Math.sin(phi) * Math.cos(theta));
                const y = radius * Math.cos(phi);
                const z = radius * Math.sin(phi) * Math.sin(theta);

                return new THREE.Vector3(x, y, z);
            };

            const addMarker = (lat, lng, color) => {
                if (!sceneRef.current) return;
                
                const markerGeometry = new THREE.SphereGeometry(0.02, 16, 16);
                const markerMaterial = new THREE.MeshBasicMaterial({ color });
                const marker = new THREE.Mesh(markerGeometry, markerMaterial);
                
                const position = latLngToVector3(lat, lng, 1.01);
                marker.position.copy(position);
                
                sceneRef.current.add(marker);
                markersRef.current.push(marker);
                
                return marker;
            };

            const addLine = (lat1, lng1, lat2, lng2) => {
                if (!sceneRef.current) return;
                
                const start = latLngToVector3(lat1, lng1, 1.01);
                const end = latLngToVector3(lat2, lng2, 1.01);
                
                const points = [];
                const segments = 50;
                
                for (let i = 0; i <= segments; i++) {
                    const t = i / segments;
                    const interpolated = new THREE.Vector3().lerpVectors(start, end, t);
                    interpolated.normalize().multiplyScalar(1.02);
                    points.push(interpolated);
                }
                
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const material = new THREE.LineBasicMaterial({ color: 0xfbbf24, linewidth: 2 });
                const line = new THREE.Line(geometry, material);
                
                sceneRef.current.add(line);
                markersRef.current.push(line);
                
                return line;
            };

            const clearMarkers = () => {
                if (!sceneRef.current) return;
                
                markersRef.current.forEach(marker => {
                    sceneRef.current.remove(marker);
                    if (marker.geometry) marker.geometry.dispose();
                    if (marker.material) marker.material.dispose();
                });
                markersRef.current = [];

                const R = 6371;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLng = (lng2 - lng1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                          Math.sin(dLng/2) * Math.sin(dLng/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                return R * c;
            };

                                            borderRadius: '12px',
                                            cursor: 'pointer',
                                            boxShadow: '0 8px 32px rgba(251, 191, 36, 0.4)',
                                            transition: 'all 0.3s ease'
                                        }}
                                    >
                                        PLAY AGAIN
                                    </button>

                                    <button
                                        onClick={shareScore}
                                        style={{
                                            fontSize: 'clamp(1.2rem, 3vw, 1.5rem)',
                                            fontWeight: 900,
                                            letterSpacing: '0.1em',
                                            padding: 'clamp(1rem, 2vw, 1.25rem) clamp(2rem, 4vw, 3rem)',
                                            background: 'transparent',
                                            color: '#10b981',
                                            border: '2px solid #10b981',
                                            borderRadius: '12px',
                                            cursor: 'pointer',
                                            transition: 'all 0.3s ease'
                                        }}
                                    >
                                        SHARE 🌍
                                    </button>

                                    <button
                                        onClick={() => {
                                            setGameState('intro');
                                            if (globeContainerRef.current) {
                                                globeContainerRef.current.innerHTML = '';
                                            }
                                            sceneRef.current = null;
                                            globeRef.current = null;
                                        }}
                                        style={{
                                            fontSize: 'clamp(1.2rem, 3vw, 1.5rem)',
                                            fontWeight: 900,
                                            letterSpacing: '0.1em',
                                            padding: 'clamp(1rem, 2vw, 1.25rem) clamp(2rem, 4vw, 3rem)',
                                            background: 'transparent',
                                            color: '#94a3b8',
                                            border: '2px solid #94a3b8',
                                            borderRadius: '12px',
                                            cursor: 'pointer',
                                            transition: 'all 0.3s ease'
                                        }}
                                    >
                                        MAIN MENU
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.render(<MapTagGame />, document.getElementById('root'));
    </script>
</body>
</html>
