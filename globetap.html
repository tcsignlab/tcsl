<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlobeTap – Guess the City</title>
  <!-- Fixed CDNs (same as before) -->
  <script src="https://unpkg.com/three/build/three.min.js"></script>
  <script src="https://unpkg.com/globe.gl/dist/globe.gl.min.js"></script>
  <script src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js"></script>
  <style>
    body { margin:0; background:#000; color:#fff; font-family:Arial,Helvetica,sans-serif; overflow:hidden; }
    #globeViz { position:absolute; width:100%; height:100%; z-index:1; }
    #ui {
      position:absolute; top:16px; left:16px; z-index:10;
      background:rgba(0,0,0,0.75); padding:14px 20px; border-radius:12px;
      font-size:1.2rem; pointer-events:none; user-select:none; line-height:1.4;
    }
    #ui div { margin:5px 0; }
    #target { font-size:1.45rem; font-weight:bold; color:#00ffcc; }
    #center {
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      text-align:center; z-index:20; pointer-events:auto;
      transition:opacity 1s ease;
    }
    #center.hidden { opacity:0; pointer-events:none; }
    .menu {
      display:flex; flex-direction:column; align-items:center; gap:14px;
      background:rgba(0,0,0,0.85); padding:30px 40px; border-radius:16px;
    }
    button {
      background:rgba(255,255,255,0.1); border:2px solid #00ddff; color:#fff;
      padding:14px 40px; font-size:1.3rem; border-radius:12px; cursor:pointer;
      transition:all .25s;
    }
    button:hover { background:#00ddff; color:#000; transform:scale(1.05); }
    #loading {
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      z-index:30; background:rgba(0,0,0,0.9); padding:20px 40px; border-radius:16px;
      font-size:1.3rem; display:none; text-align:center;
    }
  </style>
</head>
<body>
<div id="globeViz"></div>
<div id="ui">
  <div id="score">Score: 0</div>
  <div id="target">Find: ...</div>
  <div id="round-info">Round 1 / 5</div>
  <div id="timer">⏱ 10</div>
</div>
<div id="center">
  <div id="game-over" class="menu" style="display:none;">
    <p id="final-score" style="font-size:2.2rem; margin:0;">Final Score: 0</p>
    <button id="play-again-btn">Play Again</button>
  </div>
</div>
<div id="loading">🌍 Loading 140,000+ real world cities…<br><small>(one-time fetch – no repeats until all played)</small></div>

<script>
// =============== GLOBE (natural earth texture + borders – NOT white) ===============
const globeEl = document.getElementById('globeViz');
const globe = Globe()(globeEl)
  .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-day.jpg')   // realistic natural map
  .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
  .backgroundColor('#000011')
  .atmosphereColor('#77aaff')
  .atmosphereAltitude(0.35)
  .pointOfView({ lat: 25, lng: 10, altitude: 2.8 })
  // Explicit accessors + bigger brighter pins + zero transition lag = pins now work and globe feels smooth
  .pointLatitude('lat')
  .pointLongitude('lng')
  .pointAltitude('altitude')
  .pointColor('color')
  .pointRadius(0.85)
  .pointsTransitionDuration(0)          // instant updates = no clunk
  .onGlobeClick(({ lat, lng }) => { if (gameActive) handleGuess({ lat, lng }); });

// Auto-resize for smooth performance on any screen size
window.addEventListener('resize', () => {
  globe.width(window.innerWidth).height(window.innerHeight);
});

// =============== WORLD CITIES (all real cities – no repeats until exhausted) ===============
const CITIES_URL = 'https://raw.githubusercontent.com/lutangar/cities.json/master/cities.json';
let allCities = [];
let remainingCities = [];
let currentTarget = null;

const FALLBACK_CITIES = [
  {name:"New York",country:"US",lat:40.7128,lng:-74.0060},
  {name:"London",country:"GB",lat:51.5074,lng:-0.1278},
  {name:"Tokyo",country:"JP",lat:35.6762,lng:139.6503},
  {name:"Paris",country:"FR",lat:48.8566,lng:2.3522},
  {name:"Sydney",country:"AU",lat:-33.8688,lng:151.2093}
];

// Shuffle helper
function shuffle(array) {
  const copy = [...array];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

// Smart country name: if it's an ISO2 code (e.g. "US") → full name; if already full → keep it
function getCountryName(code) {
  if (!code) return 'Unknown';
  // If it's already a full name (length > 2), return as-is
  if (code.length > 2) return code;
  // Otherwise assume ISO2 and convert
  try {
    return new Intl.DisplayNames(['en'], { type: 'region' }).of(code) || code;
  } catch (e) {
    return code;
  }
}

// Load massive real-world city database once
async function loadWorldCities() {
  const loadingEl = document.getElementById('loading');
  loadingEl.style.display = 'block';
  
  try {
    const res = await fetch(CITIES_URL);
    if (!res.ok) throw new Error('Network error');
    const data = await res.json();
    
    allCities = data
      .map(city => ({
        name: city.name || city.city || city.city_ascii,
        country: city.country,        // could be ISO2 or full name depending on source
        lat: parseFloat(city.lat),
        lng: parseFloat(city.lng)
      }))
      .filter(c => !isNaN(c.lat) && !isNaN(c.lng) && c.name && c.country);
    
    console.log(`✅ Loaded ${allCities.length.toLocaleString()} real cities`);
    remainingCities = shuffle(allCities);
  } catch (err) {
    console.warn('⚠️ City database fetch failed – using fallback', err);
    allCities = FALLBACK_CITIES.map(c => ({...c}));
    remainingCities = shuffle(allCities);
  } finally {
    loadingEl.style.display = 'none';
    startGame();   // game starts only after cities ready
  }
}

// =============== COUNTRY BORDERS (kept exactly as requested) ===============
fetch('https://unpkg.com/world-atlas@2/countries-50m.json')
  .then(r => r.json())
  .then(world => {
    const countries = topojson.feature(world, world.objects.countries).features;
    globe.polygonsData(countries)
      .polygonStrokeColor(() => '#44aaff')
      .polygonStrokeWidth(0.8)
      .polygonAltitude(0.005);
  })
  .catch(err => console.warn('Could not load country borders (non-critical):', err));

// =============== DISTANCE ===============
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// =============== PIN (now guaranteed visible + smooth) ===============
let pins = [];   // moved to top for clean scope

function dropPin(lat, lng, color) {
  const pin = { lat, lng, color, altitude: 1.6 };
  pins.push(pin);
  globe.pointsData(pins);   // instant update

  // Quick drop animation (fewer frames = no clunk)
  let alt = 1.6;
  const dropStep = () => {
    alt = Math.max(alt - 0.18, 0.04);
    pin.altitude = alt;
    globe.pointsData(pins);
    if (alt > 0.04) {
      requestAnimationFrame(dropStep);
    }
  };
  dropStep();
}

// =============== GAME LOGIC ===============
let index = 0;
let score = 0;
let gameActive = false;
let timerId = null;
const TOTAL_ROUNDS = 5;
const TIME_PER_ROUND = 10;

function pickNextTarget() {
  if (remainingCities.length === 0) {
    remainingCities = shuffle([...allCities]);
  }
  currentTarget = remainingCities.splice(0, 1)[0];

  const fullCountry = getCountryName(currentTarget.country);
  document.getElementById('target').textContent = `Find: ${currentTarget.name}, ${fullCountry}`;
  document.getElementById('round-info').textContent = `Round ${index + 1} / ${TOTAL_ROUNDS}`;
}

function startGame() {
  pins = [];
  globe.pointsData([]);
  score = 0;
  index = 0;
  gameActive = true;

  document.getElementById('score').textContent = 'Score: 0';
  document.getElementById('center').classList.add('hidden');

  pickNextTarget();
  startTimer();
}

function startTimer() {
  if (timerId) clearInterval(timerId);
  let timeLeft = TIME_PER_ROUND;
  document.getElementById('timer').textContent = `⏱ ${timeLeft}`;
  timerId = setInterval(() => {
    timeLeft--;
    document.getElementById('timer').textContent = `⏱ ${timeLeft}`;
    if (timeLeft <= 0) {
      clearInterval(timerId);
      handleGuess(null);
    }
  }, 1000);
}

function handleGuess(pos) {
  if (!gameActive) return;
  if (timerId) clearInterval(timerId);

  const target = currentTarget;
  const distance = pos 
    ? haversine(pos.lat, pos.lng, target.lat, target.lng) 
    : 35000;

  let points = Math.max(0, Math.round(5200 - distance * 7.5));
  score += points;
  document.getElementById('score').textContent = `Score: ${score}`;

  if (pos) dropPin(pos.lat, pos.lng, '#ff3366');
  dropPin(target.lat, target.lng, '#00ff88');

  index++;
  if (index < TOTAL_ROUNDS) {
    pickNextTarget();
    startTimer();
  } else {
    endGame();
  }
}

function endGame() {
  gameActive = false;
  document.getElementById('final-score').innerHTML = `Final Score: <strong>${score}</strong>`;
  document.getElementById('game-over').style.display = 'flex';
  document.getElementById('center').classList.remove('hidden');
}

// =============== PLAY AGAIN ===============
document.getElementById('play-again-btn').addEventListener('click', () => {
  document.getElementById('game-over').style.display = 'none';
  startGame();
});

// =============== START EVERYTHING ===============
loadWorldCities();
</script>
</body>
</html>
