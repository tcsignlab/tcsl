<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlobeTap – Guess the City</title>

  <script src="https://unpkg.com/three"></script>
  <script src="https://unpkg.com/globe.gl"></script>
  <script src="https://unpkg.com/topojson-client@3"></script>

  <style>
    body { margin:0; background:#000; color:#fff; font-family:Arial,Helvetica,sans-serif; overflow:hidden; }
    #globeViz { position:absolute; width:100%; height:100%; z-index:1; }
    #ui {
      position:absolute; top:16px; left:16px; z-index:2;
      background:rgba(0,0,0,0.7); padding:12px 18px; border-radius:12px;
      font-size:1.15rem; pointer-events:none; user-select:none;
    }
    #ui div { margin:5px 0; }
    #center {
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      text-align:center; z-index:10; pointer-events:auto;
      transition:opacity 1s ease;
    }
    #center.hidden { opacity:0; pointer-events:none; }
  </style>
</head>
<body>

<div id="globeViz"></div>

<div id="ui">
  <div id="score">Score: 0</div>
  <div id="target"></div>
  <div id="round-info">Round 1 / 5</div>
  <div id="timer">⏱ 10</div>
</div>

<div id="center">
  <!-- Title removed so nothing blocks the game start -->
  <div id="game-over" class="menu" style="display:none;">
    <p id="final-score">Final Score: 0</p>
    <button id="play-again-btn">Play Again</button>
  </div>
</div>

<script>
// =============== GLOBE (with atmosphere so it's NOT darkened out) ===============
const globe = Globe()(document.getElementById('globeViz'))
  .globeImageUrl('//unpkg.com/three-globe/example/img/earth-dark.jpg')
  .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
  .backgroundColor('#0a0a1f')
  .atmosphereColor('#88ccff')
  .atmosphereAltitude(0.25)
  .pointOfView({ lat: 20, lng: 0, altitude: 2.6 })
  .pointAltitude('altitude')
  .pointColor('color')
  .pointRadius(0.42)
  .pointMerge(true)
  .onGlobeClick(({ lat, lng }) => { if (gameActive) handleGuess({ lat, lng }); });

// =============== SETTINGS ===============
const TOTAL_ROUNDS = 5;
const TIME_PER_ROUND = 10;

// =============== CITIES (always ready) ===============
let cities = [
  {name:"New York",country:"United States",lat:40.7128,lng:-74.0060},
  {name:"London",country:"United Kingdom",lat:51.5074,lng:-0.1278},
  {name:"Tokyo",country:"Japan",lat:35.6762,lng:139.6503},
  {name:"Paris",country:"France",lat:48.8566,lng:2.3522},
  {name:"Sydney",country:"Australia",lat:-33.8688,lng:151.2093},
  {name:"Moscow",country:"Russia",lat:55.7558,lng:37.6173},
  {name:"Beijing",country:"China",lat:39.9042,lng:116.4074},
  {name:"Cairo",country:"Egypt",lat:30.0444,lng:31.2357},
  {name:"Rio de Janeiro",country:"Brazil",lat:-22.9068,lng:-43.1729},
  {name:"Cape Town",country:"South Africa",lat:-33.9249,lng:18.4241},
  {name:"Mexico City",country:"Mexico",lat:19.4326,lng:-99.1332},
  {name:"Mumbai",country:"India",lat:19.0760,lng:72.8777},
  {name:"Berlin",country:"Germany",lat:52.5200,lng:13.4049},
  {name:"Bangkok",country:"Thailand",lat:13.7563,lng:100.5018},
  {name:"Istanbul",country:"Turkey",lat:41.0082,lng:28.9784},
  {name:"Toronto",country:"Canada",lat:43.6532,lng:-79.3832},
  {name:"Seoul",country:"South Korea",lat:37.5665,lng:126.9780},
  {name:"Lagos",country:"Nigeria",lat:6.5244,lng:3.3792},
  {name:"Buenos Aires",country:"Argentina",lat:-34.6037,lng:-58.3816},
  {name:"Jakarta",country:"Indonesia",lat:-6.2088,lng:106.8456},
  {name:"Madrid",country:"Spain",lat:40.4168,lng:-3.7038},
  {name:"Rome",country:"Italy",lat:41.9028,lng:12.4964},
  {name:"Dubai",country:"United Arab Emirates",lat:25.2048,lng:55.2708},
  {name:"Singapore",country:"Singapore",lat:1.3521,lng:103.8198},
  {name:"Los Angeles",country:"United States",lat:34.0522,lng:-118.2437},
  {name:"Chicago",country:"United States",lat:41.8781,lng:-87.6298},
  {name:"Shanghai",country:"China",lat:31.2304,lng:121.4737},
  {name:"Hong Kong",country:"China",lat:22.3193,lng:114.1694},
  {name:"Melbourne",country:"Australia",lat:-37.8136,lng:144.9631},
  {name:"Johannesburg",country:"South Africa",lat:-26.2041,lng:28.0473},
  {name:"Lima",country:"Peru",lat:-12.0464,lng:-77.0428},
  {name:"Bogota",country:"Colombia",lat:4.7109,lng:-74.0721},
  {name:"Hanoi",country:"Vietnam",lat:21.0285,lng:105.8048},
  {name:"Kuala Lumpur",country:"Malaysia",lat:3.1390,lng:101.6869},
  {name:"Athens",country:"Greece",lat:37.9838,lng:23.7275}
];

// Optional bigger list
fetch('https://raw.githubusercontent.com/lutangar/cities.json/master/cities.json')
  .then(r => r.json())
  .then(data => { cities = data.filter((_, i) => i % 16 === 0); })
  .catch(() => {});

// =============== COUNTRY BORDERS ===============
fetch('https://unpkg.com/world-atlas@2/countries-50m.json')
  .then(r => r.json())
  .then(world => {
    const countries = topojson.feature(world, world.objects.countries).features;
    globe.polygonsData(countries)
      .polygonStrokeColor(() => '#3388ff')
      .polygonStrokeWidth(0.65)
      .polygonAltitude(0.004);
  });

// =============== STATE ===============
let roundCities = [];
let pins = [];
let index = 0;
let score = 0;
let gameActive = false;
let timerId = null;

// =============== DISTANCE ===============
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// =============== PIN ===============
function dropPin(lat, lng, color) {
  const pin = {lat, lng, color, altitude:1.45};
  pins.push(pin);
  globe.pointsData(pins);
  let alt = 1.45;
  function animate() {
    alt -= 0.092;
    pin.altitude = Math.max(alt, 0.028);
    globe.pointsData(pins);
    if (alt > 0.028) requestAnimationFrame(animate);
    else {
      let bounce = 0.055;
      function bounceAnim() {
        bounce -= 0.0055;
        pin.altitude = Math.max(bounce, 0.028);
        globe.pointsData(pins);
        if (bounce > 0.028) requestAnimationFrame(bounceAnim);
      }
      bounceAnim();
    }
  }
  animate();
}

// =============== GAME ===============
function startGame() {
  pins = []; 
  globe.pointsData([]);
  score = 0;
  index = 0;
  gameActive = true;

  roundCities = [];
  for (let i = 0; i < TOTAL_ROUNDS; i++) {
    roundCities.push(cities[Math.floor(Math.random() * cities.length)]);
  }

  document.getElementById('score').textContent = 'Score: 0';
  document.getElementById('round-info').textContent = `Round 1 / ${TOTAL_ROUNDS}`;
  document.getElementById('center').classList.add('hidden');

  nextRound();
}

function nextRound() {
  if (index >= TOTAL_ROUNDS) return endGame();
  const city = roundCities[index];
  document.getElementById('target').textContent = `Find: ${city.name}, ${city.country}`;
  document.getElementById('round-info').textContent = `Round ${index + 1} / ${TOTAL_ROUNDS}`;
  startTimer();
}

function startTimer() {
  if (timerId) clearInterval(timerId);
  let timeLeft = TIME_PER_ROUND;
  document.getElementById('timer').textContent = `⏱ ${timeLeft}`;
  timerId = setInterval(() => {
    timeLeft--;
    document.getElementById('timer').textContent = `⏱ ${timeLeft}`;
    if (timeLeft <= 0) {
      clearInterval(timerId);
      handleGuess(null);
    }
  }, 1000);
}

function handleGuess(pos) {
  if (!gameActive) return;
  if (timerId) clearInterval(timerId);

  const target = roundCities[index];
  const distance = pos ? haversine(pos.lat, pos.lng, target.lat, target.lng) : 35000;
  let points = Math.max(0, Math.round(5200 - distance * 7.5));
  score += points;

  document.getElementById('score').textContent = `Score: ${score}`;
  if (pos) dropPin(pos.lat, pos.lng, '#ff3366');
  dropPin(target.lat, target.lng, '#33ff99');

  index++;
  setTimeout(nextRound, 2300);
}

function endGame() {
  gameActive = false;
  document.getElementById('final-score').innerHTML = `Final Score: <strong>${score}</strong>`;
  document.getElementById('game-over').style.display = 'flex';
  document.getElementById('center').classList.remove('hidden');
}

// =============== PLAY AGAIN ===============
document.getElementById('play-again-btn').addEventListener('click', () => {
  document.getElementById('game-over').style.display = 'none';
  startGame();
});

// =============== AUTO START (delayed so globe finishes initializing) ===============
setTimeout(startGame, 800);
</script>
</body>
</html>
