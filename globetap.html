    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Bebas Neue', Impact, sans-serif;
        }

        #root {
            width: 100vw;
            height: 100vh;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .leaflet-container {
            background: #0f172a !important;
        }

        .leaflet-tile-pane {
            filter: brightness(0.8) contrast(1.2);
        }

        .custom-marker {
            background: transparent;
        }
    </style>
</head>

        const MapTagGame = () => {
            const [gameState, setGameState] = useState('intro');
            const [currentRound, setCurrentRound] = useState(0);
            const [gameCities, setGameCities] = useState([]);
            const [guesses, setGuesses] = useState([]);
            const [totalScore, setTotalScore] = useState(0);
            const [highScore, setHighScore] = useState(0);
            const [usedCities, setUsedCities] = useState([]);
            
            const mapRef = useRef(null);
            const mapContainerRef = useRef(null);
            const guessMarkerRef = useRef(null);
            const actualMarkerRef = useRef(null);
            const lineRef = useRef(null);

            useEffect(() => {
                const savedHighScore = localStorage.getItem('maptag-highscore');
                const savedUsedCities = localStorage.getItem('maptag-used-cities');
                
                if (savedHighScore) setHighScore(parseInt(savedHighScore));
                if (savedUsedCities) setUsedCities(JSON.parse(savedUsedCities));
            }, []);

            useEffect(() => {
                if (gameState === 'playing' && !mapRef.current && mapContainerRef.current) {
                    const map = L.map(mapContainerRef.current, {
                        center: [20, 0],
                        zoom: 2,
                        minZoom: 2,
                        maxZoom: 6,
                        zoomControl: true,
                        attributionControl: false
                    });

                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap',
                        maxZoom: 19
                    }).addTo(map);

                    mapRef.current = map;
                    map.on('click', handleMapClick);
                }

                return () => {
                    if (mapRef.current) {
                        mapRef.current.remove();
                        mapRef.current = null;
                    }
                };
            }, [gameState]);

            const calculateDistance = (lat1, lng1, lat2, lng2) => {
                const R = 6371;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLng = (lng2 - lng1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                          Math.sin(dLng/2) * Math.sin(dLng/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                return R * c;
            };

            const calculateScore = (distance) => {
                const maxScore = 1000;
                const score = Math.max(50, Math.round(maxScore / (1 + distance / 100)));
                return score;
            };

            const selectRandomCities = () => {
                let availableCities = CITIES_DATABASE.filter(
                    city => !usedCities.includes(city.name)
                );

                if (availableCities.length < 5) {
                    setUsedCities([]);
                    availableCities = [...CITIES_DATABASE];
                }

                const shuffled = [...availableCities].sort(() => Math.random() - 0.5);
                return shuffled.slice(0, 5);
            };

            const startNewGame = () => {
                const selectedCities = selectRandomCities();
                setGameCities(selectedCities);
                setCurrentRound(0);
                setGuesses([]);
                setTotalScore(0);
                setGameState('playing');
            };

            const handleMapClick = (e) => {
                if (currentRound >= gameCities.length || guesses.length > currentRound) return;

                const { lat, lng } = e.latlng;
                const currentCity = gameCities[currentRound];
                
                const distance = calculateDistance(lat, lng, currentCity.lat, currentCity.lng);
                const score = calculateScore(distance);

                if (guessMarkerRef.current) guessMarkerRef.current.remove();
                if (actualMarkerRef.current) actualMarkerRef.current.remove();
                if (lineRef.current) lineRef.current.remove();

                guessMarkerRef.current = L.marker([lat, lng], {
                    icon: L.divIcon({
                        className: 'custom-marker',
                        html: '<div style="background: #ef4444; width: 20px; height: 20px; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.3);"></div>',
                        iconSize: [20, 20]
                    })
                }).addTo(mapRef.current);

                actualMarkerRef.current = L.marker([currentCity.lat, currentCity.lng], {
                    icon: L.divIcon({
                        className: 'custom-marker',
                        html: '<div style="background: #10b981; width: 20px; height: 20px; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.3);"></div>',
                        iconSize: [20, 20]
                    })
                }).addTo(mapRef.current);

                lineRef.current = L.polyline([[lat, lng], [currentCity.lat, currentCity.lng]], {
                    color: '#fbbf24',
                    weight: 2,
                    dashArray: '5, 10'
                }).addTo(mapRef.current);

                const newGuess = {
                    city: currentCity,
                    guessLat: lat,
                    guessLng: lng,
                    distance: Math.round(distance),
                    score
                };

                setGuesses([...guesses, newGuess]);
                setTotalScore(totalScore + score);

                setTimeout(() => {
                    if (currentRound < gameCities.length - 1) {
                        setCurrentRound(currentRound + 1);
                        if (guessMarkerRef.current) guessMarkerRef.current.remove();
                        if (actualMarkerRef.current) actualMarkerRef.current.remove();
                        if (lineRef.current) lineRef.current.remove();
                    } else {
                        endGame();
                    }
                }, 2000);
            };

            const endGame = () => {
                setGameState('results');
                
                if (totalScore > highScore) {
                    setHighScore(totalScore);
                    localStorage.setItem('maptag-highscore', totalScore.toString());
                }

                const newUsedCities = [...usedCities, ...gameCities.map(c => c.name)];
                setUsedCities(newUsedCities);
                localStorage.setItem('maptag-used-cities', JSON.stringify(newUsedCities));
            };

            const quitGame = () => {
                if (confirm('Are you sure you want to quit? Your progress will be lost.')) {
                    setGameState('intro');
                    if (mapRef.current) {
                        mapRef.current.remove();
                        mapRef.current = null;
                    }
                }
            };

            const shareScore = () => {
                const text = `I scored ${totalScore} points in MapTag! Can you beat my score? 🌍`;
                if (navigator.share) {
                    navigator.share({ text });
                } else {
                    navigator.clipboard.writeText(text);
                    alert('Score copied to clipboard!');
                }
            };

            return (
                <div style={{
                    width: '100vw',
                    height: '100vh',
                    background: 'linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%)',
                    fontFamily: '"Bebas Neue", "Impact", sans-serif',
                    overflow: 'hidden',
                    position: 'relative'
                }}>
                    <div style={{
                        position: 'absolute',
                        inset: 0,
                        backgroundImage: `url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")`,
                        opacity: 0.4
                    }} />

                    {gameState === 'intro' && (
                        <div style={{
                            position: 'relative',
                            zIndex: 10,
                            height: '100%',
                            display: 'flex',
                            flexDirection: 'column',
                            alignItems: 'center',
                            justifyContent: 'center',
                            padding: '2rem',
                            color: 'white'
                        }}>
                            <div style={{ textAlign: 'center', maxWidth: '800px', animation: 'fadeIn 1s ease-out' }}>

                                    <div style={{
                                        fontSize: '6rem',
                                        fontWeight: 900,
                                        letterSpacing: '0.1em',
                                        background: 'linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%)',
                                        WebkitBackgroundClip: 'text',
                                        WebkitTextFillColor: 'transparent',
                                        textShadow: '0 4px 20px rgba(251, 191, 36, 0.3)',
                                        marginBottom: '0.5rem'
                                    }}>
                                        MAPTAG
                                    </div>
                                    <div style={{
                                        fontSize: '1.5rem',
                                        color: '#94a3b8',
                                        letterSpacing: '0.3em',
                                        fontFamily: 'monospace',
                                        fontWeight: 300
                                    }}>
                                        GEOGRAPHIC CHALLENGE
                                    </div>
                                </div>

                                <div style={{
                                    background: 'rgba(251, 191, 36, 0.1)',
                                    border: '2px solid #fbbf24',
                                    borderRadius: '12px',
                                    padding: '1.5rem',
                                    marginBottom: '2rem',
                                    animation: 'fadeIn 1s ease-out 0.3s backwards'
                                }}>
                                    <div style={{ fontSize: '1rem', color: '#fbbf24', letterSpacing: '0.2em', marginBottom: '0.5rem' }}>
                                        HIGH SCORE
                                    </div>
                                    <div style={{ fontSize: '3rem', fontWeight: 900, color: '#fbbf24' }}>
                                        {highScore.toLocaleString()}
                                    </div>
                                </div>

                                <div style={{
                                    background: 'rgba(255, 255, 255, 0.05)',
                                    backdropFilter: 'blur(10px)',
                                    border: '1px solid rgba(255, 255, 255, 0.1)',
                                    borderRadius: '16px',
                                    padding: '2rem',
                                    marginBottom: '2rem',
                                    textAlign: 'left',
                                    animation: 'fadeIn 1s ease-out 0.5s backwards'
                                }}>
                                    <h3 style={{ fontSize: '2rem', marginBottom: '1.5rem', color: '#fbbf24', letterSpacing: '0.1em' }}>
                                        HOW TO PLAY
                                    </h3>
                                    <div style={{
                                        fontSize: '1.2rem',
                                        lineHeight: '2',
                                        color: '#cbd5e1',
                                        fontFamily: '"Segoe UI", sans-serif',
                                        fontWeight: 300,
                                        letterSpacing: '0.05em'
                                    }}>
                                        <div style={{ marginBottom: '1rem', display: 'flex', gap: '1rem' }}>
                                            <span style={{ color: '#fbbf24', fontSize: '1.5rem' }}>1.</span>
                                            <span>You'll be shown the name of a city on the world map</span>
                                        </div>
                                        <div style={{ marginBottom: '1rem', display: 'flex', gap: '1rem' }}>
                                            <span style={{ color: '#fbbf24', fontSize: '1.5rem' }}>2.</span>
                                            <span>Click on the map where you think that city is located</span>
                                        </div>
                                        <div style={{ marginBottom: '1rem', display: 'flex', gap: '1rem' }}>
                                            <span style={{ color: '#fbbf24', fontSize: '1.5rem' }}>3.</span>
                                            <span>Earn points based on accuracy - closer is better!</span>
                                        </div>
                                        <div style={{ marginBottom: '1rem', display: 'flex', gap: '1rem' }}>
                                            <span style={{ color: '#fbbf24', fontSize: '1.5rem' }}>4.</span>
                                            <span>Guess 5 cities per game and try to beat your high score</span>
                                        </div>
                                        <div style={{ display: 'flex', gap: '1rem' }}>
                                            <span style={{ color: '#fbbf24', fontSize: '1.5rem' }}>5.</span>
                                            <span>All cities will appear once before repeating</span>
                                        </div>
                                    </div>
                                </div>

                                <button
                                    onClick={startNewGame}
                                    style={{
                                        fontSize: '2rem',
                                        fontWeight: 900,
                                        letterSpacing: '0.2em',
                                        padding: '1.5rem 4rem',
                                        background: 'linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%)',
                                        color: '#0f172a',
                                        border: 'none',
                                        borderRadius: '12px',
                                        cursor: 'pointer',
                                        boxShadow: '0 8px 32px rgba(251, 191, 36, 0.4)',
                                        transition: 'all 0.3s ease',
                                        animation: 'pulse 2s ease-in-out infinite'
                                    }}
                                    onMouseEnter={(e) => {
                                        e.target.style.transform = 'translateY(-4px) scale(1.05)';
                                        e.target.style.boxShadow = '0 12px 48px rgba(251, 191, 36, 0.6)';
                                    }}
                                    onMouseLeave={(e) => {
                                        e.target.style.transform = 'translateY(0) scale(1)';
                                        e.target.style.boxShadow = '0 8px 32px rgba(251, 191, 36, 0.4)';
                                    }}
                                >
                                    START GAME
                                </button>
                            </div>
                        </div>
                    )}

                    {gameState === 'playing' && (
                        <div style={{ position: 'relative', height: '100%', display: 'flex', flexDirection: 'column' }}>
                            <div style={{
                                background: 'rgba(15, 23, 42, 0.95)',
                                backdropFilter: 'blur(10px)',
                                padding: '1.5rem 2rem',
                                display: 'flex',
                                justifyContent: 'space-between',
                                alignItems: 'center',
                                borderBottom: '2px solid #fbbf24',
                                zIndex: 1000
                            }}>
                                <div style={{ display: 'flex', gap: '2rem', alignItems: 'center' }}>
                                    <div>
                                        <div style={{ fontSize: '0.9rem', color: '#94a3b8', letterSpacing: '0.1em' }}>ROUND</div>
                                        <div style={{ fontSize: '2rem', color: '#fbbf24', fontWeight: 900 }}>
                                            {currentRound + 1} / 5
                                        </div>
                                    </div>
                                    <div>
                                        <div style={{ fontSize: '0.9rem', color: '#94a3b8', letterSpacing: '0.1em' }}>SCORE</div>
                                        <div style={{ fontSize: '2rem', color: '#10b981', fontWeight: 900 }}>
                                            {totalScore.toLocaleString()}
                                        </div>
                                    </div>
                                </div>

                                <div style={{
                                    background: 'rgba(251, 191, 36, 0.1)',
                                    border: '2px solid #fbbf24',
                                    borderRadius: '8px',
                                    padding: '1rem 2rem'
                                }}>
                                    <div style={{ fontSize: '0.9rem', color: '#fbbf24', letterSpacing: '0.1em', marginBottom: '0.25rem' }}>
                                        FIND THIS CITY
                                    </div>
                                    <div style={{ fontSize: '2.5rem', color: 'white', fontWeight: 900 }}>
                                        {gameCities[currentRound]?.name}
                                    </div>
                                    <div style={{ fontSize: '1.2rem', color: '#94a3b8', fontFamily: 'monospace' }}>
                                        {gameCities[currentRound]?.country}
                                    </div>
                                </div>

                                <button
                                    onClick={quitGame}
                                    style={{
                                        fontSize: '1rem',
                                        letterSpacing: '0.1em',
                                        padding: '0.75rem 1.5rem',
                                        background: 'transparent',
                                        color: '#ef4444',
                                        border: '2px solid #ef4444',
                                        borderRadius: '8px',
                                        cursor: 'pointer',
                                        transition: 'all 0.3s ease',
                                        fontFamily: 'inherit',
                                        fontWeight: 700
                                    }}
                                    onMouseEnter={(e) => {
                                        e.target.style.background = '#ef4444';
                                        e.target.style.color = 'white';
                                    }}
                                    onMouseLeave={(e) => {
                                        e.target.style.background = 'transparent';
                                        e.target.style.color = '#ef4444';
                                    }}
                                >
                                    QUIT
                                </button>
                            </div>

                            <div 
                                ref={mapContainerRef}
                                style={{
                                    flex: 1,
                                    position: 'relative',
                                    cursor: guesses.length > currentRound ? 'default' : 'crosshair'
                                }}
                            />

                            {guesses[currentRound] && (
                                <div style={{
                                    position: 'absolute',
                                    bottom: '2rem',
                                    left: '50%',
                                    transform: 'translateX(-50%)',
                                    background: 'rgba(15, 23, 42, 0.98)',
                                    backdropFilter: 'blur(20px)',
                                    border: '2px solid #fbbf24',
                                    borderRadius: '16px',
                                    padding: '2rem',
                                    minWidth: '400px',
                                    textAlign: 'center',
                                    animation: 'slideUp 0.5s ease-out',
                                    boxShadow: '0 20px 60px rgba(0, 0, 0, 0.5)',
                                    zIndex: 1000
                                }}>
                                    <div style={{ fontSize: '1rem', color: '#94a3b8', letterSpacing: '0.1em', marginBottom: '0.5rem' }}>
                                        DISTANCE
                                    </div>
                                    <div style={{ fontSize: '3rem', color: '#fbbf24', fontWeight: 900, marginBottom: '1rem' }}>
                                        {guesses[currentRound].distance.toLocaleString()} km
                                    </div>
                                    <div style={{ fontSize: '1rem', color: '#94a3b8', letterSpacing: '0.1em', marginBottom: '0.5rem' }}>
                                        POINTS EARNED
                                    </div>
                                    <div style={{ fontSize: '2.5rem', color: '#10b981', fontWeight: 900 }}>
                                        +{guesses[currentRound].score.toLocaleString()}
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {gameState === 'results' && (
                        <div style={{
                            position: 'relative',
                            zIndex: 10,
                            height: '100%',
                            display: 'flex',
                            flexDirection: 'column',
                            alignItems: 'center',
                            justifyContent: 'center',
                            padding: '2rem',
                            color: 'white',
                            overflowY: 'auto'
                        }}>
                            <div style={{ textAlign: 'center', maxWidth: '800px' }}>
                                <div style={{
                                    fontSize: '3rem',
                                    fontWeight: 900,
                                    letterSpacing: '0.1em',
                                    color: '#fbbf24',
                                    marginBottom: '2rem'
                                }}>
                                    GAME COMPLETE!
                                </div>

                                <div style={{
                                    background: 'linear-gradient(135deg, rgba(251, 191, 36, 0.2) 0%, rgba(245, 158, 11, 0.1) 100%)',
                                    border: '3px solid #fbbf24',
                                    borderRadius: '16px',
                                    padding: '2rem',
                                    marginBottom: '2rem'
                                }}>
                                    <div style={{ fontSize: '1.2rem', color: '#fbbf24', letterSpacing: '0.2em', marginBottom: '1rem' }}>
                                        FINAL SCORE
                                    </div>
                                    <div style={{ fontSize: '5rem', fontWeight: 900, color: 'white', marginBottom: '1rem' }}>
                                        {totalScore.toLocaleString()}
                                    </div>
                                    {totalScore >= highScore - totalScore && (
                                        <div style={{ fontSize: '1.5rem', color: '#10b981', letterSpacing: '0.1em' }}>
                                            🏆 NEW HIGH SCORE! 🏆
                                        </div>
                                    )}
                                </div>

                                <div style={{
                                    background: 'rgba(255, 255, 255, 0.05)',
                                    backdropFilter: 'blur(10px)',
                                    border: '1px solid rgba(255, 255, 255, 0.1)',
                                    borderRadius: '16px',
                                    padding: '2rem',
                                    marginBottom: '2rem',
                                    textAlign: 'left'
                                }}>
                                    <h3 style={{
                                        fontSize: '1.5rem',
                                        marginBottom: '1.5rem',
                                        color: '#fbbf24',
                                        letterSpacing: '0.1em'
                                    }}>
                                        ROUND BREAKDOWN
                                    </h3>
                                    {guesses.map((guess, idx) => (
                                        <div key={idx} style={{
                                            display: 'flex',
                                            justifyContent: 'space-between',
                                            padding: '1rem',
                                            borderBottom: idx < guesses.length - 1 ? '1px solid rgba(255, 255, 255, 0.1)' : 'none',
                                            fontFamily: '"Segoe UI", sans-serif'
                                        }}>
                                            <div style={{ flex: 1 }}>
                                                <div style={{ fontSize: '1.2rem', color: 'white', fontWeight: 600 }}>
                                                    {guess.city.name}, {guess.city.country}
                                                </div>
                                            </div>
                                            <div style={{ display: 'flex', gap: '2rem', alignItems: 'center' }}>
                                                <div style={{ textAlign: 'right' }}>
                                                    <div style={{ fontSize: '0.9rem', color: '#94a3b8' }}>Distance</div>
                                                    <div style={{ fontSize: '1.2rem', color: '#fbbf24' }}>
                                                        {guess.distance.toLocaleString()} km
                                                    </div>
                                                </div>
                                                <div style={{ textAlign: 'right' }}>
                                                    <div style={{ fontSize: '0.9rem', color: '#94a3b8' }}>Points</div>
                                                    <div style={{ fontSize: '1.2rem', color: '#10b981', fontWeight: 700 }}>
                                                        {guess.score.toLocaleString()}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <div style={{ display: 'flex', gap: '1rem', justifyContent: 'center', flexWrap: 'wrap' }}>
                                    <button
                                        onClick={startNewGame}
                                        style={{
                                            fontSize: '1.5rem',
                                            fontWeight: 900,
                                            letterSpacing: '0.1em',
                                            padding: '1.25rem 3rem',
                                            background: 'linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%)',
                                            color: '#0f172a',
                                            border: 'none',
                                            borderRadius: '12px',
                                            cursor: 'pointer',
                                            boxShadow: '0 8px 32px rgba(251, 191, 36, 0.4)',
                                            transition: 'all 0.3s ease'
                                        }}
                                    >
                                        PLAY AGAIN
                                    </button>

                                    <button
                                        onClick={shareScore}
                                        style={{
                                            fontSize: '1.5rem',
                                            fontWeight: 900,
                                            letterSpacing: '0.1em',
                                            padding: '1.25rem 3rem',
                                            background: 'transparent',
                                            color: '#10b981',
                                            border: '2px solid #10b981',
                                            borderRadius: '12px',
                                            cursor: 'pointer',
                                            transition: 'all 0.3s ease'
                                        }}
                                    >
                                        SHARE 🌍
                                    </button>

                                    <button
                                        onClick={() => setGameState('intro')}
                                        style={{
                                            fontSize: '1.5rem',
                                            fontWeight: 900,
                                            letterSpacing: '0.1em',
                                            padding: '1.25rem 3rem',
                                            background: 'transparent',
                                            color: '#94a3b8',
                                            border: '2px solid #94a3b8',
                                            borderRadius: '12px',
                                            cursor: 'pointer',
                                            transition: 'all 0.3s ease'
                                        }}
                                    >
                                        MAIN MENU
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.render(<MapTagGame />, document.getElementById('root'));
    </script>
</body>
</html>
