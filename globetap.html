<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GlobeTap</title>

<script src="https://unpkg.com/three"></script>
<script src="https://unpkg.com/globe.gl"></script>
<script src="https://unpkg.com/topojson-client@3"></script>

<style>
body { margin:0; background:#000; color:#fff; font-family:Arial; overflow:hidden;}
#globeViz { position:absolute; width:100%; height:100%; }

#ui {
  position:absolute; top:15px; left:15px;
  background:rgba(0,0,0,0.6);
  padding:12px; border-radius:10px;
}

#center {
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}

button { padding:10px; margin:5px; cursor:pointer; }
</style>
</head>

<body>

<div id="globeViz"></div>

<div id="ui">
  <div id="score">Score: 0</div>
  <div id="target"></div>
  <div id="timer">⏱️ 10</div>
</div>

<div id="center">
  <h1>🌍 GlobeTap</h1>
  <p id="status">Loading...</p>
  <button id="startBtn" disabled onclick="startGame()">Start Game</button>
</div>

<script>
// ===== INIT GLOBE =====
const globe = Globe()(document.getElementById('globeViz'))
  .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-dark.jpg')
  .backgroundColor('#000');

// ===== STATE =====
let cities = [];
let roundCities = [];
let index = 0;
let score = 0;
let gameActive = false;
let timer;

// ===== LOAD LIGHTWEIGHT BORDERS =====
fetch('https://unpkg.com/world-atlas@2/countries-50m.json')
.then(res => res.json())
.then(data => {
  const countries = topojson.feature(data, data.objects.countries).features;

  globe.polygonsData(countries)
    .polygonStrokeColor(() => "#00aaff")
    .polygonAltitude(0.003);
});

// ===== LOAD SMALLER CITY SET =====
fetch('https://raw.githubusercontent.com/lutangar/cities.json/master/cities.json')
.then(res => res.json())
.then(data => {
  // keep only major cities
  cities = data.filter(c => Math.random() < 0.02);

  document.getElementById("status").innerText = "Ready!";
  document.getElementById("startBtn").disabled = false;
});

// ===== DISTANCE =====
function dist(a,b,c,d){
  const R=6371;
  const dLat=(c-a)*Math.PI/180;
  const dLon=(d-b)*Math.PI/180;
  const x=Math.sin(dLat/2)**2 +
    Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*
    Math.sin(dLon/2)**2;
  return R*(2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)));
}

// ===== START =====
function startGame(){
  gameActive = true;
  document.getElementById("center").style.display="none";

  score = 0;
  index = 0;
  roundCities = [];

  for(let i=0;i<5;i++){
    roundCities.push(cities[Math.floor(Math.random()*cities.length)]);
  }

  next();
}

// ===== NEXT =====
function next(){
  if(index>=5) return end();

  let c = roundCities[index];

  document.getElementById("target").innerText =
    "Find: " + c.name + ", " + c.country;

  startTimer();
}

// ===== TIMER =====
function startTimer(){
  let time = 10;
  document.getElementById("timer").innerText = "⏱️ " + time;

  clearInterval(timer);
  timer = setInterval(()=>{
    time--;
    document.getElementById("timer").innerText = "⏱️ " + time;

    if(time<=0){
      clearInterval(timer);
      handleGuess(null);
    }
  },1000);
}

// ===== PIN DROP (OPTIMIZED) =====
function dropPin(lat,lng,color){
  let altitude = 1;

  function animate(){
    altitude -= 0.05;

    globe.pointsData([{
      lat,lng,color,size:0.5, altitude:Math.max(altitude,0)
    }]);

    if(altitude > 0){
      requestAnimationFrame(animate);
    }
  }

  animate();
}

// ===== CLICK =====
globe.onGlobeClick(({lat,lng})=>{
  if(!gameActive) return;
  handleGuess({lat,lng});
});

// ===== GUESS =====
function handleGuess(pos){
  clearInterval(timer);

  let c = roundCities[index];
  let d = pos ? dist(pos.lat,pos.lng,c.lat,c.lng) : 20000;

  let pts = Math.max(0,5000 - d*10);
  score += Math.round(pts);

  if(pos) dropPin(pos.lat,pos.lng,'red');
  dropPin(c.lat,c.lng,'lime');

  document.getElementById("score").innerText = "Score: " + score;

  index++;
  setTimeout(next,2000);
}

// ===== END =====
function end(){
  gameActive = false;
  document.getElementById("center").style.display="block";
  document.getElementById("status").innerText = "Final Score: " + score;
}
</script>

</body>
</html>
